    else ex.push(exo('Dips sur banc',3,dl?6:10,'reps',{repos:'90 s'}));}

    const weighted=ph==='Développement'&&!dl&&c.dips>=15&&has(p,'lest');
    if(weighted){ex.push(exo('Dips lestés',5,5,'reps',{repos:'3 min',lest:true,charge:'+10 à +15 kg (2 répétitions en réserve)'}));}
    else{const sr=setsReps(c.dips,pct,dl,4,5);ex.push(exo('Dips stricts',sr.series,sr.reps,'reps',{repos:'2 min'}));}

    }else if(g.def.sport==='sw'){

    }else if(g.type==='jump'){

    }

  for(const k of (p.vMatchJours||[])){const di=DAY_KEYS.indexOf(k);if(fixed.some(f=>f[0]===di&&f[1].goal))continue;
    fixed.push([di,mkSession({sport:'volley',kind:'v-match',title:'Match de volley',dureeMin:120,intensite:'Compétition',hard:'match',log:'volley',fixedSlot:true,blocks:[txt('Préparation','Échauffement long et progressif, épaules à l’élastique, sauts progressifs.')]})]);}

  const isLegs=d=>d>=0&&d<7&&cells[d].some(s=>s.hard==='legs'||s.hard==='match');

      }
      if(s.hard==='upper'){
        if(d>0&&cells[d-1].some(x=>x.hard==='upper'))sc+=4;
        if(d<6&&cells[d+1].some(x=>x.hard==='upper'))sc+=4;

      }
      if(s.hard==='none'&&isMatchDay(d+1))sc+=1;
      if(s.long&&(d===5||d===6))sc-=4;

  }

  cells.forEach((list,d)=>list.forEach((s,j)=>{s.day=d;s.date=toStr(dateOf(d));s.id=s.date+'_'+s.kind;out.push(s);}));
  w.unplaced=unplaced.map(s=>s.title);
  return out;
}

  for(const l of logs){const d=parseDate(l.date);if(!d)continue;const ago=daysBetween(d,t);if(ago<0)continue;const L=logLoad(l);if(ago<7)acute+=L;if(ago<28)chronic+=L;}

    const map={pullups:'tractions',dips:'dips',pushups:'pompes',muscleup:'muscleup',frontlever:'fl',planche:'planche',handstand:'handstand',lsit:'lsit',jump:'vDetente'};

  }
  pts.sort((a,b)=>a.x-b.x);return pts;
}

function liveAction(a){
  const L=S.live;if(!L)return;const exs=L.plan.blocks.filter(b=>b.t==='ex');const e=exs[L.ex];
  try{if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(x){}
  const lestEl=document.getElementById('liveLest');if(lestEl&&lestEl.value!=='')L.lest[L.ex]=num(lestEl.value);
  if(document.getElementById('liveBands')){const sel=readChips('liveBands');L.bands=L.bands||[];L.res=L.res||[];L.bands[L.ex]=sel;L.res[L.ex]=sel.length?bandsSum(sel):null;}
  const goNext=(record)=>{
    L.vals[L.ex][L.set]=record;
    const np=nextPos(L);
    if(!np){L.done=true;L.rest=null;}
    else{const rest=parseRest(e.repos);L.ex=np.ex;L.set=np.set;const ne=exs[np.ex];L.cur=np.set===0?ne.cible:(lastValFor(L,np.ex)??ne.cible);L.rest=record===null?null:{until:Date.now()+rest*1000,total:rest};}
    saveLiveLocal();renderLive();
  };
  switch(a){
    case 'inc':L.cur=Math.min(500,(+L.cur||0)+1);break;
    case 'dec':L.cur=Math.max(0,(+L.cur||0)-1);break;
    case 'inc5':L.cur=Math.min(600,(+L.cur||0)+5);break;
    case 'dec5':L.cur=Math.max(0,(+L.cur||0)-5);break;
    case 'validate':return goNext(+L.cur);
    case 'missed':return goNext(null);
    case 'skipex':{for(let i=L.set;i<L.vals[L.ex].length;i++)if(L.vals[L.ex][i]===undefined)L.vals[L.ex][i]=null;L.set=L.vals[L.ex].length-1;const np=nextPos(L);if(!np)L.done=true;else{L.ex=np.ex;L.set=np.set;L.cur=exs[np.ex].cible;}L.rest=null;saveLiveLocal();renderLive();return;}
    case 'rest+15':if(L.rest){L.rest.until+=15000;L.rest.total+=15;}saveLiveLocal();renderLive();return;
    case 'skiprest':L.rest=null;saveLiveLocal();renderLive();return;
    case 'back':{L.done=false;const ei=exs.length-1;let si=L.vals[ei].length-1;L.ex=ei;L.set=si;L.cur=L.vals[ei][si]??exs[ei].cible;L.vals[ei][si]=undefined;saveLiveLocal();renderLive();return;}
    case 'pause':closeLive();toast('Séance en pause : reprends-la depuis le tableau de bord.');render();return;
    case 'finish':{
      const dur=Math.max(1,Math.round((Date.now()-L.startedAt)/60000));
      S.editLog={id:uid(),createdAt:Date.now(),date:L.date,plannedId:L.sid,plan:L.plan,sport:L.sport,title:L.title,statut:L.vals.flat().every(v=>v!=null&&v!==undefined)?'realisee':'partielle',dureeMin:dur,
        sets:exs.map((x,i)=>({nom:x.nom,unite:x.unite,cible:x.cible,vals:L.vals[i].map(v=>v===undefined?null:v),lest:L.lest[i],band:x.band||null,res:(L.res&&L.res[i]!=null)?L.res[i]:null,bands:(L.bands&&L.bands[i])||null})),_new:true};
      S.live=null;lsSet(LS_LIVE,null);closeLive();S.draftSession=null;go('suivi');toast('Répétitions remplies : ajoute ton effort ressenti et enregistre.');return;}
    case 'abandon':S.live=null;lsSet(LS_LIVE,null);closeLive();toast('Séance en cours abandonnée.');render();return;
  }
  const v=document.getElementById('liveVal');if(v)v.innerHTML=`${L.cur}<small> ${e.unite==='s'?'s':'reps'}</small>`;
  saveLiveLocal();
}

  const wStart=wk?toStr(wk.start):ts,wEnd=wk?toStr(addDays(wk.start,6)):ts;
  const wkLogs=S.logs.filter(l=>l.date>=wStart&&l.date<=wEnd);
  const kmDone=wkLogs.reduce((s,l)=>s+(l.sport==='course'&&l.run&&l.statut!=='annulee'?(num(l.run.distance)||0):0),0);
  const kmPlan=wkSess.reduce((s,x)=>s+(x.sport==='course'?(x.plannedKm||0):0),0);
  const ac=acwr(S.logs,t);
  let acTxt='—',acCls='info',acMsg='Pas encore assez de séances saisies (4 semaines nécessaires pour un ratio fiable).';
  if(ac.ratio!=null){acTxt=fr(ac.ratio,2);
    if(ac.ratio>1.5){acCls='bad';acMsg='Charge de la semaine très supérieure à ton habitude : risque de blessure accru. Allège les prochains jours.';}

  const recent=S.logs.filter(l=>daysBetween(parseDate(l.date),t)<=7&&daysBetween(parseDate(l.date),t)>=0);
  const avg=k=>{const v=recent.map(l=>num(l[k])).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
  const forme=avg('forme'),douleur=avg('douleur'),sommeil=avg('sommeil');
  const alerts=[];

  if(forme!=null&&forme<=2)alerts.push({lvl:'warn',txt:'Forme basse sur 7 jours : la fatigue s’accumule. Avance ta prochaine semaine allégée ou dors davantage.'});
  if(sommeil!=null&&sommeil<6.5)alerts.push({lvl:'warn',txt:`Sommeil moyen de ${fr(sommeil)} h sur 7 jours : c’est ce qui limite le plus ta récupération en ce moment.`});
  const late=sess.filter(s=>s.date<ts&&!logFor(s.id)&&daysBetween(parseDate(s.date),t)<=7);
  if(late.length)alerts.push({lvl:'warn',txt:`${late.length} séance${late.length>1?'s':''} des 7 derniers jours ${late.length>1?'ne sont pas saisies':'n’est pas saisie'}. Saisis-les, même annulées : sinon tes courbes et ta charge sont fausses.`});

  const goals=A.goals.filter(g=>g.dateObj);
  if(!S.chartGoal||!goals.find(g=>g.id===S.chartGoal))S.chartGoal=(goals.find(g=>g.def.kind!=='event')||{}).id;
  const prenom=p.prenom?esc(p.prenom):'';
  app().innerHTML=`${demoBanner()}
  <section class="row between">
    <div><span class="eyebrow">${wk?`Semaine ${wk.index} sur ${P.nW} · ${esc(wk.label)}`:'Hors programme'}</span><h2>${prenom?'Salut '+prenom:'Ton tableau de bord'}</h2></div>
    <div class="row"><button class="btn" data-goto="programme">Voir le programme</button><button class="btn primary" data-act="new-log">Saisir une séance</button></div>
  </section>
  ${S.live?`<div class="notice ok"><div class="row between"><p><b>Séance en cours :</b> ${esc(S.live.title)}</p><div class="row"><button class="btn sm primary" data-live="resume">Reprendre</button><button class="btn sm danger" data-live="abandon">Abandonner</button></div></div></div>`:''}
  ${[...A.warnings.filter(w=>w.lvl==='bad'),...alerts].map(a=>`<div class="notice ${a.lvl}"><p>${a.txt}</p></div>`).join('')}
  ${mainGoalCard(goals,p)}
  <section class="grid g4">
    <div class="card kpi"><span class="eyebrow">Cette semaine</span><div class="v">${wkDone}<small> / ${wkSess.length} séances</small></div><div class="bar" style="margin-top:10px"><i style="width:${wkSess.length?Math.round(wkDone/wkSess.length*100):0}%"></i></div></div>
    <div class="card kpi s-course"><span class="eyebrow">Course cette semaine</span><div class="v">${fr(kmDone)}<small> / ${fr(kmPlan)} km</small></div><div class="bar" style="margin-top:10px"><i style="width:${kmPlan?clamp(Math.round(kmDone/kmPlan*100),0,100):0}%;background:var(--run)"></i></div></div>
    <div class="card kpi"><span class="eyebrow">Ratio charge aiguë / chronique</span><div class="row"><div class="v">${acTxt}</div><span class="pill ${acCls}">${acCls==='ok'?'Optimal':acCls==='bad'?'Risque':acCls==='warn'?'À surveiller':'En attente'}</span></div><p class="small muted" style="margin-top:6px">${acMsg}</p></div>
    <div class="card kpi"><span class="eyebrow">Assiduité depuis le début</span><div class="v">${adh==null?'—':adh+'<small> %</small>'}</div><p class="small muted" style="margin-top:6px">${done} séance${done>1?'s':''} faite${done>1?'s':''} sur ${past.length} prévue${past.length>1?'s':''}. Au-dessus de 80 %, le programme produit ses effets.</p></div>
  </section>

        <div><span class="eyebrow">Sommeil</span><div class="kpi"><div class="v" style="font-size:1.8rem">${sommeil==null?'—':fr(sommeil)}<small> h</small></div></div></div>
        <div><span class="eyebrow">Douleur</span><div class="kpi"><div class="v" style="font-size:1.8rem">${douleur==null?'—':fr(douleur)}<small> / 10</small></div></div></div>
      </div>
      <p class="small muted">Moyennes de tes saisies des 7 derniers jours.</p>
    </div>
  </section>
  <section class="stack">
    <h3>Mes objectifs</h3>
    <div class="grid g3">${goals.map(g=>goalCard(g,p)).join('')||'<p class="muted">Aucun objectif daté.</p>'}</div>
  </section>
  <section class="card stack">
    <div class="row between"><h3>Courbe de progression</h3>
      <div class="f" style="min-width:260px"><label for="cg" class="small">Objectif affiché</label><select id="cg">${goals.filter(g=>g.def.kind!=='event').map(g=>`<option value="${g.id}" ${g.id===S.chartGoal?'selected':''}>${esc(g.def.label.replace('…',''))} → ${esc(goalTargetLabel(g))}</option>`).join('')}</select></div>
    </div>
    <div class="chartbox"><canvas id="chProg" aria-label="Courbe de progression vers l’objectif"></canvas></div>
    <p class="small muted" id="chProgNote"></p>
  </section>
  <section class="grid g2">
    <div class="card stack"><h3>Charge d’entraînement hebdomadaire</h3><div class="chartbox"><canvas id="chLoad" aria-label="Charge hebdomadaire"></canvas></div><p class="small muted">Charge = durée (min) × effort ressenti (1 à 10), méthode sRPE de Foster. Les semaines allégées doivent apparaître en creux.</p></div>
    <div class="card stack"><h3>Kilomètres de course par semaine</h3><div class="chartbox"><canvas id="chKm" aria-label="Kilomètres par semaine"></canvas></div><p class="small muted">Barres pleines : réalisé. Barres claires : prévu par le programme.</p></div>
  </section>`;

function fatigueBanner(s){
  if(logFor(s.id)||s.date!==toStr(today()))return '';
  const fs=fatigueStatus(s.date);
  if(s.light)return `<div class="notice ok"><div class="row between"><p class="small">Version allégée choisie pour aujourd’hui.</p><button class="btn sm" data-unlight="${s.id}">Revenir à la séance prévue</button></div></div>`;
  if(fs.level==='ok'||!canLighten(s))return '';
  return `<div class="notice ${fs.level==='light'?'bad':'warn'}"><p class="small"><b>${fs.level==='light'?'Version allégée recommandée':'Prudence'}</b> : ${esc(fs.reasons.join(', '))}.</p><div class="row" style="margin-top:8px"><button class="btn sm ${fs.level==='light'?'primary':''}" data-light="${s.id}">Passer en version allégée</button></div></div>`;
}
function sessionLine(s){
  const st=statusOf(s);
  const canMove=!logFor(s.id)&&s.date>=toStr(today())&&!s.fixedSlot&&!s.goal;
  return `<div class="row between" style="border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:10px" class="s-${s.sport}">
    <div class="s-${s.sport}" style="display:grid;gap:2px">${sportTag(s.sport)}<b>${esc(s.title)}</b><span class="small muted">≈ ${s.dureeMin} min · ${esc(s.intensite)}</span></div>
    <div class="row"><button class="btn sm" data-sess="${s.id}">Détail</button>${canMove?`<button class="btn sm" data-move="${s.id}">Je ne peux pas</button>`:''}${(st==='todo'||st==='late')&&s.log==='sw'?`<button class="btn sm primary" data-live-start="${s.id}">Démarrer</button>`:''}${st==='todo'||st==='late'?`<button class="btn sm ${s.log==='sw'?'':'primary'}" data-log="${s.id}">Saisir</button>`:`<span class="pill ${st==='done'?'ok':st==='part'?'warn':'bad'}">${STATUS_TXT[st]}</span>`}</div>
  </div>${fatigueBanner(s)}`;
}
/* ---- Avancement vers un objectif : résultats mesurés + séances réalisées ---- */
const GOAL_SPORT_FILTER={course:s=>s.sport==='course',sw:s=>s.sport==='sw',volley:s=>s.sport==='volley',general:s=>true};
function goalProgress(g,p,logs,A){
  const def=g.def,F=g.feas,R={pct:null,current:null,initial:null,target:F.target,src:'',expected:null,prep:null,status:null};
  if(def.kind==='event')return R;
  const pts=goalSeries(g,p,logs,A);
  // 1) Résultats
  if(def.kind==='time'){
    const ini=initialP5(p);const i0=riegel(ini.p5*5,5,def.dist);
    // Seul un chrono réalisé sur la distance de l'objectif (à 3 % près) est un vrai résultat.
    // Un chrono sur 5 ou 10 km converti en temps de semi reste une projection.
    const real=logs.filter(l=>l.statut!=='annulee'&&l.tests&&l.tests.run&&+l.tests.run.sec&&Math.abs(+l.tests.run.dist-def.dist)/def.dist<=0.03)
      .map(l=>({d:l.date,y:riegel(+l.tests.run.sec,+l.tests.run.dist,def.dist)})).sort((a,b)=>a.d<b.d?-1:1);
    let cur=pts.length?pts[pts.length-1].y:null,src=pts.length>1?'projection d’après ton chrono de test':'projection d’après ton chrono du questionnaire';
    if(templateMode(p)){const fit=runFitness(p,logs,'9999-12-31');const est=riegel(fit.p5*5,5,def.dist);if(cur==null||est<cur){cur=est;src='projection d’après tes fractionnés';}}
    if(real.length){const best=Math.min(...real.map(x=>x.y));if(cur==null||best<=cur){cur=best;src='chrono réalisé sur '+fr(def.dist)+' km';}else R.est=true;}else R.est=true;
    R.initial=pts.length?pts[0].y:i0;R.current=cur;R.src=src;
    if(R.initial!=null&&R.current!=null&&F.target)R.pct=R.initial<=F.target?100:clamp((R.initial-R.current)/(R.initial-F.target)*100,0,100);
    // Au-delà de 10 km, la vitesse ne suffit pas : tant que l'endurance n'est pas construite, la barre est limitée par ta plus longue sortie.
    if(R.pct!=null&&def.dist>10&&!real.length){
      const longest=Math.max(num(p.sortieLongue)||0,...logs.filter(l=>l.statut!=='annulee'&&l.sport==='course'&&l.run).map(l=>num(l.run.distance)||0));
      const need=def.long||def.dist*0.9,cap=Math.round(clamp(longest/need,0,1)*95);
      R.longest=longest;R.need=need;
      if(cap<R.pct){R.pct=cap;R.endCap=true;R.src=`limité par ta plus longue sortie : ${fr(longest)} km sur ${fr(need)} km visés`;}
    }
  }else if(['reps','sec','stage','cm','kg','finish','volume'].includes(def.kind)){
    if(pts.length){R.initial=pts[0].y;R.current=pts[pts.length-1].y;R.src=pts.length>1?pts[pts.length-1].src:'questionnaire';}
    // Tractions, dips, pompes : estimation du maximum d'après les séances, si plus récente que le dernier test
    const key={pullups:/^Tractions strictes/,dips:/^Dips stricts/,pushups:/^Pompes strictes/}[g.type];
    if(key){const lastTest=pts.length?pts[pts.length-1].x:0;
      const L=logs.filter(l=>l.statut!=='annulee'&&+parseDate(l.date)>lastTest&&(l.sets||[]).some(s=>key.test(s.nom))).sort((a,b)=>a.date<b.date?1:-1)[0];
      if(L){const s=L.sets.find(x=>key.test(x.nom));const best=Math.max(0,...s.vals.filter(v=>v!=null));const est=Math.round(best/0.75);if(best&&(R.current==null||est>R.current)){R.current=est;R.src='estimé d’après ta séance du '+fmtDate(parseDate(L.date));R.est=true;}}}
    if(R.initial!=null&&R.current!=null&&F.target!=null){
      if(def.kind==='kg')R.pct=R.initial===F.target?100:clamp(Math.abs(R.initial-R.current)/Math.abs(R.initial-F.target)*100*(Math.sign(F.target-R.initial)===Math.sign(R.current-R.initial)?1:0),0,100);
      else R.pct=R.initial>=F.target?100:clamp((R.current-R.initial)/(F.target-R.initial)*100,0,100);
    }
  }
  // 2) Séances de préparation (sport de l'objectif) depuis le début du programme jusqu'au jour J
  const P=S.program,ts=toStr(today()),gd=toStr(g.dateObj),filt=GOAL_SPORT_FILTER[def.sport]||(s=>true);
  if(P){const all=P.weeks.flatMap(w=>w.sessions).filter(s=>filt(s)&&s.date<=gd);
    const past=all.filter(s=>s.date<ts||(s.date===ts&&logFor(s.id)));
    const done=past.filter(s=>{const l=logFor(s.id);return l&&l.statut!=='annulee';});
    R.prep={done:done.length,past:past.length,total:all.length,pct:past.length?Math.round(done.length/past.length*100):null};}
  // 3) Où tu devrais en être aujourd'hui (trajectoire linéaire entre le début et le jour J)
  const st=P?P.start:A.start;const tot=daysBetween(st,g.dateObj),el=clamp(daysBetween(st,today()),0,tot);
  R.expected=tot>0?Math.round(el/tot*100):100;
  // Une estimation ne vaut pas un test : plafonnée à 95 %, l'objectif n'est « atteint » que sur un vrai test.
  if(R.est&&R.pct!=null&&R.pct>95){R.pct=95;R.confirm=true;}
  if(R.pct!=null){const d=R.pct-R.expected;R.status=R.pct>=100?['ok','Objectif atteint']:R.confirm?['ok','À confirmer par un test']:d>=-5?['ok','Dans les temps']:d>=-20?['warn','Léger retard']:['bad','En retard'];}
  return R;
}
function fmtGoalV(g,v){if(v==null)return '—';if(g.def.kind==='time')return fmtTime(v);if(g.def.kind==='stage')return g.def.stages[Math.round(v)]||'—';return fr(v)+' '+(g.def.unit||'');}
function progressBlock(g,R,big){
  if(g.def.kind==='event')return '<p class="small muted">Objectif de forme le jour J : pas de mesure chiffrée.</p>';
  const pct=R.pct==null?null:Math.round(R.pct);
  return `<div class="stack" style="gap:8px">
    <div class="row between"><span class="eyebrow">Résultats</span>${R.status?`<span class="pill ${R.status[0]}">${R.status[1]}</span>`:''}</div>
    <div class="row between" style="align-items:baseline"><div class="kpi"><div class="v" style="${big?'':'font-size:1.9rem'}">${pct==null?'—':pct}<small> %</small></div></div><span class="small muted" style="text-align:right">${R.current!=null?`${R.est&&g.def.kind==='time'?'Projection':'Actuel'} : <b style="color:var(--ink)">${fmtGoalV(g,R.current)}</b><br>${esc(R.src)}`:'Pas encore de mesure'}</span></div>
    <div class="bar" style="height:${big?16:12}px;position:relative" role="img" aria-label="${pct==null?'Pas de mesure':pct+' % du chemin vers l’objectif'}"><i style="width:${pct||0}%;${R.status&&R.status[0]==='ok'?'background:var(--ok)':R.status&&R.status[0]==='bad'?'background:var(--bad)':R.status&&R.status[0]==='warn'?'background:var(--warn)':''}"></i>${R.expected!=null&&R.expected<100?`<span title="Où tu devrais en être aujourd’hui" style="position:absolute;top:-3px;bottom:-3px;left:${R.expected}%;width:2px;background:var(--ink)"></span>`:''}</div>
    <div class="row between tiny muted"><span>Départ : ${fmtGoalV(g,R.initial)}</span><span>Repère : ${R.expected} % aujourd’hui</span><span>Cible : ${esc(goalTargetLabel(g))}</span></div>
    ${R.prep&&R.prep.total?`<div class="row between small" style="margin-top:4px"><span class="muted">Séances ${esc(SPORT_LABEL[g.def.sport]||'')} faites</span><b class="num">${R.prep.done} / ${R.prep.past}${R.prep.pct!=null?` (${R.prep.pct} %)`:''}</b></div>
      <div class="bar"><i style="width:${R.prep.past?R.prep.done/R.prep.past*100:0}%;background:var(--c,var(--accent))"></i></div>
      <span class="tiny muted">${R.prep.total-R.prep.past} séance${R.prep.total-R.prep.past>1?'s':''} restante${R.prep.total-R.prep.past>1?'s':''} d’ici le jour J.</span>`:''}
  </div>`;
}
function goalTitle(g){const l=g.def.label;return /…/.test(l)?l.replace('…',' '+goalTargetLabel(g)).replace(/ \(km\)$/,''):l.replace(/ \(.*\)$/,'')+' : '+goalTargetLabel(g);}
function mainGoalCard(goals,p){
  const g=goals.filter(x=>x.def.kind!=='event').sort((a,b)=>(b.priorite==='principal')-(a.priorite==='principal')||a.dateObj-b.dateObj)[0];
  if(!g)return '';
  const R=goalProgress(g,p,S.logs,S.program.A),days=daysBetween(today(),g.dateObj);
  let advice='';
  if(R.pct==null)advice='Fais un premier test ou un premier fractionné pour mesurer ton point de départ.';
  else if(R.pct>=100)advice='Objectif atteint. Tu peux viser plus haut dans le questionnaire.';
  else if(R.endCap)advice=`Ta vitesse sur 5 ou 10 km permettrait le chrono visé, mais tu n’as jamais couru plus de ${fr(R.longest)} km. Sur ${fr(g.def.dist)} km, c’est l’endurance qui décide : la barre avancera avec ta sortie longue, jusqu’à ${fr(R.need)} km.`;
  else if(R.confirm)advice='D’après tes séances, tu as probablement déjà le niveau. Seul un test le prouvera : fais-le lors de la prochaine semaine allégée.';
  else if(R.status[0]==='ok')advice='Continue comme ça : tes résultats avancent au moins aussi vite que le temps qui passe.';
  else if(R.prep&&R.prep.pct!=null&&R.prep.pct<80)advice=`Ton retard vient surtout des séances manquées (${R.prep.pct} % faites). C’est le premier levier à corriger.`;
  else advice='Tu fais tes séances, mais les résultats suivent moins vite que prévu : regarde ton sommeil et ta récupération, ou décale la date de l’objectif.';
  return `<section class="card stack s-${g.def.sport}" style="border-left:5px solid var(--c)">
    <div class="row between"><div><span class="eyebrow">Objectif ${g.priorite==='principal'?'principal':'le plus proche'}</span><h3>${esc(goalTitle(g))}</h3></div><span class="num"><b>${days>=0?'J-'+days:'Passé'}</b> · ${fmtDateY(g.dateObj)}</span></div>
    ${progressBlock(g,R,true)}
    <p class="small">${esc(advice)}</p>
    <details><summary class="small">Comment ces pourcentages sont calculés</summary><div class="stack small" style="margin-top:6px">
      <p><b>Résultats :</b> le chemin parcouru entre ton niveau de départ et ta cible. Exemple : départ à 10 tractions, cible 15, actuel 12, soit 40 %. En course, le temps est estimé sur la distance de l’objectif à partir de ton allure actuelle, recalculée à chaque fractionné, ou de ton dernier chrono de test. Pour les tractions, dips et pompes, entre deux tests, le maximum est estimé à partir de ta meilleure série (répétitions ÷ 0,75) : c’est une estimation, le test de la semaine allégée fait foi. Tant que le résultat n’est qu’estimé, la barre s’arrête à 95 % : seul un vrai test peut afficher 100 %.</p>
      <p><b>Courses de plus de 10 km :</b> ton chrono sur 5 ou 10 km converti en temps de semi ou de marathon n’est qu’une projection, et elle est optimiste si tu n’as pas l’endurance. Tant que tu n’as pas couru la distance, la barre ne peut pas dépasser ta plus longue sortie rapportée à la sortie longue visée en fin de préparation (par exemple 10 km sur 20 km, soit 48 %). Seul un vrai chrono sur la distance affiche 100 %.</p>
      <p><b>Séances :</b> les séances du sport concerné faites, sur celles déjà passées depuis le début du programme. Une séance annulée compte comme non faite.</p>
      <p><b>Repère (trait noir) :</b> où tu devrais en être aujourd’hui si tu progressais régulièrement jusqu’au jour J. En pratique, on progresse plus vite au début : être un peu au-dessus du repère est normal, être nettement en dessous est un signal d’alerte.</p>
    </div></details>
  </section>`;
}
function goalCard(g,p){
  const F=g.feas,days=daysBetween(today(),g.dateObj);
  const R=goalProgress(g,p,S.logs,S.program.A);
  return `<div class="card stack s-${g.def.sport}" style="border-top:4px solid var(--c)">

function chartBase(){
  const ink=cssVar('--muted'),line=cssVar('--line');
  return {ink,line,opts:{responsive:true,maintainAspectRatio:false,animation:false,plugins:{legend:{labels:{color:ink,boxWidth:12,font:{family:'Barlow'}}},tooltip:{}},scales:{x:{ticks:{color:ink},grid:{color:line}},y:{ticks:{color:ink},grid:{color:line}}}}};
}
function drawDashboardCharts(){
  if(typeof Chart==='undefined'){['chProg','chLoad','chKm'].forEach(id=>{const c=document.getElementById(id);if(c)c.parentElement.innerHTML='<p class="muted small">Graphiques indisponibles (bibliothèque non chargée).</p>';});return;}
  const P=S.program,p=S.profile,A=P.A;
  const {ink,line,opts}=chartBase();
  const accent=cssVar('--accent'),run=cssVar('--run'),ok=cssVar('--ok'),warn=cssVar('--warn');
  // Progression
  const g=A.goals.find(x=>x.id===S.chartGoal);
  const note=document.getElementById('chProgNote');
  if(g&&document.getElementById('chProg')){
    const pts=goalSeries(g,p,S.logs,A),F=g.feas;
    const sp={course:run,sw:cssVar('--sw'),volley:cssVar('--volley'),general:accent}[g.def.sport];
    const ds=[{label:'Mesures',data:pts.map(q=>({x:q.x,y:q.y,src:q.src})),borderColor:sp,backgroundColor:sp,pointRadius:5,pointHoverRadius:7,showLine:true,tension:0.15,borderWidth:2.5}];
    const startX=pts.length?pts[0].x:+A.start,startY=pts.length?pts[0].y:F.initial;
    if(F.target!=null&&startY!=null){
      ds.push({label:'Trajectoire nécessaire',data:[{x:startX,y:startY},{x:+g.dateObj,y:F.target}],borderColor:ink,borderDash:[6,5],pointRadius:[0,6],pointStyle:'crossRot',borderWidth:1.5,showLine:true,backgroundColor:ink});
      if(F.realDate&&(F.verdict==='no'||F.verdict==='hard')&&F.need)ds.push({label:'Trajectoire réaliste',data:[{x:startX,y:startY},{x:+F.realDate,y:F.target}],borderColor:warn,borderDash:[2,4],pointRadius:0,borderWidth:2,showLine:true});
    }
    const isTime=g.def.kind==='time',isStage=g.def.kind==='stage';
    const o=JSON.parse(JSON.stringify(opts));
    o.scales.x={type:'linear',ticks:{color:ink,callback:v=>fmtDate(new Date(v)),maxTicksLimit:8},grid:{color:line}};
    o.scales.y.ticks.callback=v=>isTime?fmtTime(v):isStage?(g.def.stages[v]||''):fr(v)+(g.def.unit==='s'?' s':g.def.unit==='cm'?' cm':g.def.unit==='kg'?' kg':'');
    if(isStage){o.scales.y.min=0;o.scales.y.max=g.def.stages.length-1;o.scales.y.ticks.stepSize=1;}
    o.plugins.tooltip={callbacks:{title:it=>fmtDateY(new Date(it[0].parsed.x)),label:it=>{const v=it.parsed.y;const val=isTime?fmtTime(v):isStage?g.def.stages[Math.round(v)]:fr(v)+' '+(g.def.unit||'');const src=it.raw&&it.raw.src?' ('+it.raw.src+')':'';return it.dataset.label+' : '+val+src;}}};
    S.charts.push(new Chart(document.getElementById('chProg'),{type:'scatter',data:{datasets:ds},options:o}));
    note.textContent=(isTime?'Temps équivalent sur la distance objectif, calculé à partir de tes chronos (formule de Riegel). Plus bas = plus rapide. ':'')+(pts.length<=1?'Saisis tes tests (semaines allégées) pour voir ta courbe se construire.':`${pts.length} mesures. Si tes points restent au-dessus de la ligne pointillée${isTime?' (en temps)':''}, tu es en retard sur la trajectoire nécessaire.`);
  }
  // Semaines
  const t=today();
  const weeks=P.weeks.filter(w=>w.start<=t).slice(-12);
  const firstMon=weeks.length?weeks[0].start:mondayOf(t);
  const labels=weeks.map(w=>'S'+w.index);
  const load=weeks.map(w=>{const a=toStr(w.start),b=toStr(addDays(w.start,6));return S.logs.filter(l=>l.date>=a&&l.date<=b).reduce((s,l)=>s+logLoad(l),0);});
  const ratio=weeks.map(w=>{const r=acwr(S.logs,addDays(w.start,6)).ratio;return r==null?null:Math.round(r*100)/100;});
  if(document.getElementById('chLoad')){
    const o=JSON.parse(JSON.stringify(opts));
    o.scales.y.title={display:true,text:'Charge (UA)',color:ink};
    o.scales.y2={position:'right',min:0,suggestedMax:2,ticks:{color:ink},grid:{display:false},title:{display:true,text:'Ratio',color:ink}};
    S.charts.push(new Chart(document.getElementById('chLoad'),{data:{labels,datasets:[{type:'bar',label:'Charge',data:load,backgroundColor:accent,borderRadius:4,yAxisID:'y'},{type:'line',label:'Ratio aigu / chronique',data:ratio,borderColor:warn,backgroundColor:warn,yAxisID:'y2',tension:0.2,spanGaps:true}]},options:o}));
  }
  if(document.getElementById('chKm')){
    const done=weeks.map(w=>{const a=toStr(w.start),b=toStr(addDays(w.start,6));return Math.round(S.logs.filter(l=>l.date>=a&&l.date<=b&&l.sport==='course'&&l.run&&l.statut!=='annulee').reduce((s,l)=>s+(num(l.run.distance)||0),0)*10)/10;});
    const plan=weeks.map(w=>Math.round(w.sessions.reduce((s,x)=>s+(x.sport==='course'?(x.plannedKm||0):0),0)));
    const o=JSON.parse(JSON.stringify(opts));o.scales.y.title={display:true,text:'km',color:ink};
    S.charts.push(new Chart(document.getElementById('chKm'),{type:'bar',data:{labels,datasets:[{label:'Prévu',data:plan,backgroundColor:run+'40',borderColor:run,borderWidth:1,borderRadius:4},{label:'Réalisé',data:done,backgroundColor:run,borderRadius:4}]},options:o}));
  }
}

function validateQ(d,onlyStep){
  const errs={};
  const req=(id,val,msg)=>{if(val===''||val==null)errs[id]=msg||'Champ obligatoire.';};
  const rng=(id,val,a,b,lab)=>{if(val===''||val==null)return;const n=num(val);if(n==null||n<a||n>b)errs[id]=`${lab||'Valeur'} entre ${a} et ${b}.`;};
  const step=(i)=>onlyStep==null||onlyStep===i;
  if(step(0)){req('q_age',d.age);rng('q_age',d.age,14,90,'Âge');req('q_taille',d.taille);rng('q_taille',d.taille,120,230,'Taille');req('q_poids',d.poids);rng('q_poids',d.poids,30,200,'Poids');rng('q_fcRepos',d.fcRepos,30,110,'FC de repos');rng('q_fcMax',d.fcMax,120,230,'FC max');req('q_sommeil',d.sommeil);rng('q_sommeil',d.sommeil,3,12,'Sommeil');if(d.fcRepos&&d.fcMax&&num(d.fcRepos)>=num(d.fcMax))errs.q_fcMax='La FC max doit dépasser la FC de repos.';}
  if(step(1)){if(!parseDate(d.debut))errs.q_debut='Date invalide.';if(!(d.jours||[]).length)errs.q_jours='Coche au moins un jour.';req('q_seancesMax',d.seancesMax);rng('q_seancesMax',d.seancesMax,2,14,'Nombre de séances');}
  if(step(2)){for(const [id,k,mx] of [['q_tractions','tractions',80],['q_dips','dips',120],['q_pompes','pompes',200]]){req(id,d[k],'Indique ton maximum (0 si aucun).');rng(id,d[k],0,mx);}rng('q_muscleup',d.muscleup,0,50);rng('q_handstandMur',d.handstandMur,0,600);rng('q_handstand',d.handstand,0,300);rng('q_lsit',d.lsit,0,120);
    (d.elastiques||[]).forEach((b,i)=>{const mn=num(b.min),mx=num(b.max);
      if(!b.nom&&b.min===''&&b.max===''){errs['b_nom_'+i]='Ligne vide : remplis-la ou supprime-la.';return;}
      if(!b.nom)errs['b_nom_'+i]='Indique la couleur ou un nom.';
      if(mx==null||mx<1||mx>150)errs['b_max_'+i]='Résistance max entre 1 et 150 kg.';
      if(b.min!==''&&(mn==null||mn<0||mn>150))errs['b_min_'+i]='Entre 0 et 150 kg.';
      else if(mn!=null&&mx!=null&&mn>mx)errs['b_min_'+i]='Le min doit être inférieur au max.';});
    rng('q_trAssReps',d.trAssReps,0,50,'Répétitions');rng('q_dpAssReps',d.dpAssReps,0,60,'Répétitions');
    if(d.trAssReps!==''&&d.trAssReps!=null&&!d.trAssBand)errs.q_trAssBand='Choisis l’élastique utilisé.';
    if(d.dpAssReps!==''&&d.dpAssReps!=null&&!d.dpAssBand)errs.q_dpAssBand='Choisis l’élastique utilisé.';}
  if(step(3)){req('q_kmSemaine',d.kmSemaine,'Indique ton volume (0 si tu ne cours pas).');rng('q_kmSemaine',d.kmSemaine,0,200);rng('q_sortieLongue',d.sortieLongue,0,60);
    for(const [id,k,dist] of [['q_ref5','ref5',5],['q_ref10','ref10',10]]){if(!d[k])continue;const s=parseTime(d[k]);if(!s){errs[id]='Format attendu : mm:ss ou h:mm:ss.';continue;}const pace=s/dist;if(pace<150||pace>900)errs[id]=`Ce chrono donne ${fmtPace(pace)} : vérifie le format (h:mm:ss au-delà d’une heure).`;}
    if(d.allureBase){const s=parseTime(d.allureBase);if(!s||s<150||s>900)errs.q_allureBase='Format mm:ss, entre 2:30 et 15:00.';}}
  if(step(1)&&d.semaine){d.semaine.days.forEach((list,di)=>{if(list.length>3)errs['tpl_'+di]='Trois séances maximum par jour.';for(const it of list)if(it.km!=null){const k=num(it.km);if(k==null||k<2||k>42)errs['tpl_'+di]='Distance entre 2 et 42 km.';}});const vm=num(d.semaine.volMax);if(vm==null||vm<10||vm>150)errs.q_volMax='Entre 10 et 150 km.';}
  if(step(4)){rng('q_vDetente',d.vDetente,5,120,'Détente');}
  if(step(5)){
    if(!(d.objectifs||[]).length)errs.goals='Ajoute au moins un objectif.';
    (d.objectifs||[]).forEach((g,i)=>{const def=GOALS[g.type];if(!def)return;const dt=parseDate(g.date);
      if(!dt)errs['g_date_'+i]='Date obligatoire.';else if(dt<today())errs['g_date_'+i]='Date passée.';
      if(def.kind==='time'){const s=parseTime(g.cible);if(!s)errs['g_cible_'+i]='Format mm:ss ou h:mm:ss.';else{const pace=s/def.dist;if(pace<150||pace>900)errs['g_cible_'+i]=`Allure de ${fmtPace(pace)} : vérifie le format.`;}}
      else if(def.kind==='stage'){if(!(+g.cible>0))errs['g_cible_'+i]='Choisis un stade.';}
      else if(def.kind!=='event'){const n=num(g.cible);if(n==null||n<=0)errs['g_cible_'+i]='Valeur positive obligatoire.';else if(def.kind==='finish'&&n>100)errs['g_cible_'+i]='100 km maximum.';else if(def.kind==='kg'&&(n<35||n>180))errs['g_cible_'+i]='Entre 35 et 180 kg.';}
    });
  }
  return errs;
}

/* ---------- Nutrition ---------- */
const NEAT={sedentaire:1.2,debout:1.35,physique:1.5};
const OBJ_LABEL={perte:'Perte de poids',maintien:'Maintien',prise:'Prise de muscle',recompo:'Recomposition (perdre du gras, garder le muscle)'};
/* Énergie dépensée par séance (kcal nettes, au-dessus du repos).
   Course : environ 1 kcal par kg et par km. Autres : (MET − 1) × kg × heures. */
function sessionKcal(s,kg){
  if(s.sport==='course'&&s.plannedKm)return s.plannedKm*kg*1.0;
  const met=s.kind==='v-match'||s.kind==='v-event'?6:s.sport==='volley'?(s.kind==='v-club'?5:5.5):s.sport==='sw'?(s.intensite==='Test'?4:5):4;
  return (met-1)*kg*(s.dureeMin||60)/60;
}
function weekTraining(kg,fallbackH){
  const P=S.program;const ts=toStr(today());
  if(P){
    const w=P.weeks.find(x=>ts>=toStr(x.start)&&ts<=toStr(addDays(x.start,6)))||P.weeks[0];
    const days={};let kcal=0,hours=0,runH=0,km=0;
    for(const s of w.sessions){const k=sessionKcal(s,kg);kcal+=k;hours+=(s.dureeMin||0)/60;days[s.date]=(days[s.date]||0)+k;if(s.sport==='course'){runH+=(s.dureeMin||0)/60;km+=s.plannedKm||0;}}
    return {source:'programme',label:`semaine ${w.index} du programme (${esc(w.label)})`,kcal,hours,runH,km,nDays:Object.keys(days).length,sessions:w.sessions.length};
  }
  const hrs=num(fallbackH)||0;return {source:'estimation',label:'ton estimation d’heures de sport',kcal:5*kg*hrs,hours:hrs,runH:0,km:0,nDays:Math.min(7,Math.ceil(hrs)),sessions:Math.ceil(hrs)};
}
function linReg(pts){const n=pts.length;if(n<2)return null;const mx=pts.reduce((s,p)=>s+p.x,0)/n,my=pts.reduce((s,p)=>s+p.y,0)/n;let a=0,b=0;for(const p of pts){a+=(p.x-mx)*(p.y-my);b+=(p.x-mx)*(p.x-mx);}return b?a/b:null;}
function weightTrend(pz){
  if(pz.length<4)return null;
  const last=parseDate(pz[pz.length-1].date);
  const win=pz.filter(z=>daysBetween(parseDate(z.date),last)<=21);
  const span=daysBetween(parseDate(win[0].date),last);
  if(win.length<4||span<14)return null;
  const slope=linReg(win.map(z=>({x:daysBetween(parseDate(win[0].date),parseDate(z.date)),y:z.kg})));
  return slope==null?null:{perWeek:slope*7,span,n:win.length};
}
function nutriInputs(){
  const p=S.profile||{},st=(S.nutri&&S.nutri.settings)||{};
  const pz=nutriPesees();const lastLogW=[...S.logs].filter(l=>l.poids).sort((a,b)=>a.date<b.date?-1:1).pop();
  let kg=pz.length?pz[pz.length-1].kg:null;
  if(lastLogW&&(!pz.length||lastLogW.date>pz[pz.length-1].date))kg=+lastLogW.poids;
  if(kg==null)kg=num(p.poids);
  return {kg,sexe:st.sexe||p.sexe||'',age:st.age!=null&&st.age!==''?st.age:p.age,taille:st.taille!=null&&st.taille!==''?st.taille:p.taille,metier:st.metier||p.metier||'sedentaire',bf:st.bf||'',objectif:st.objectif||'',rythme:st.rythme||'0.5',heures:st.heures||''};
}
function weightGoal(){const A=S.program&&S.program.A;return A?A.goals.find(g=>g.type==='weight'&&g.feas.verdict!=='past'):null;}
function nutriCalc(o){
  const R={warnings:[]};
  const kg=num(o.kg),cm=num(o.taille),age=num(o.age),bf=num(o.bf);
  if(!kg||!cm||!age){R.missing=true;return R;}
  // Métabolisme de base
  const sexK=o.sexe==='F'?-161:o.sexe==='H'?5:-78;
  const mif=10*kg+6.25*cm-5*age+sexK;
  let bmr=mif,bmrSrc='Mifflin-St Jeor';
  const ffm=bf?kg*(1-bf/100):null;
  if(ffm){bmr=370+21.6*ffm;bmrSrc='Katch-McArdle, à partir de ta masse maigre';}
  const neat=NEAT[o.metier]||1.2;
  const tr=weekTraining(kg,o.heures);
  const base=bmr*neat;
  const exDay=tr.kcal/7;
  const tdee=base+exDay;
  // Objectif
  let obj=o.objectif,rate=num(o.rythme)||0,wg=weightGoal(),fromGoal=false;
  if(!obj){if(wg){obj=num(wg.cible)<kg?'perte':num(wg.cible)>kg?'prise':'maintien';fromGoal=true;}else obj='maintien';}
  if(wg&&(obj==='perte'||obj==='prise')){
    const weeks=Math.max(1,daysBetween(today(),wg.dateObj)/7);
    const req=Math.abs(num(wg.cible)-kg)/weeks/kg*100;
    R.goalRate={req,target:num(wg.cible),date:wg.dateObj};
    if(fromGoal||!o.rythme)rate=clamp(Math.round(req*4)/4,obj==='perte'?0.25:0.1,obj==='perte'?1:0.5);
  }
  let adj=0;
  if(obj==='perte')adj=-(rate/100*kg)*7700/7;
  else if(obj==='prise')adj=(rate/100*kg)*7700/7;
  else if(obj==='recompo')adj=-0.1*tdee;
  if(obj==='perte'&&-adj>0.25*tdee){adj=-0.25*tdee;R.warnings.push({lvl:'warn',txt:'Le déficit est plafonné à 25 % de ta dépense : au-delà, tu perds du muscle et tes performances chutent.'});}
  if(obj==='prise'&&adj>500)adj=500;
  let target=tdee+adj;
  if(target<bmr*1.1&&obj!=='prise'){target=bmr*1.1;R.warnings.push({lvl:'bad',txt:'Avec ce rythme, tu passerais sous ton métabolisme de base. J’ai relevé l’apport au minimum raisonnable : réduis le rythme de perte.'});}
  // Protéines
  const bmi=kg/Math.pow(cm/100,2);
  const refKg=bmi>30?25*Math.pow(cm/100,2):kg;
  let pPerKg=obj==='perte'||obj==='recompo'?2.2:obj==='prise'?1.8:1.8;
  let P=pPerKg*refKg;
  if(ffm&&(obj==='perte'||obj==='recompo'))P=Math.max(P,2.5*ffm);
  // Lipides : 0,9 g/kg, au moins 20 % des calories, jamais sous 0,6 g/kg
  let F=Math.max(0.9*kg,0.2*target/9);
  let C=(target-P*4-F*9)/4;
  // Besoin minimal en glucides selon le volume d'entraînement
  const cMin=(tr.hours>=8?5:tr.hours>=5?4:3)*kg;
  if(C<cMin){const F2=Math.max(0.6*kg,(target-P*4-cMin*4)/9);C=(target-P*4-F2*9)/4;F=F2;}
  if(C<cMin*0.9)R.warnings.push({lvl:'warn',txt:`Avec ${fr(tr.hours)} h de sport prévues cette semaine, il te faudrait au moins ${Math.round(cMin)} g de glucides par jour (${(cMin/kg).toFixed(0)} g/kg) pour bien récupérer. Ton déficit actuel ne le permet pas : réduis le rythme de perte ou accepte des séances moins bonnes.`});
  // Disponibilité énergétique (risque de déficit énergétique relatif, RED-S)
  if(ffm){const ea=(target-exDay)/ffm;R.ea=ea;const lim=o.sexe==='F'?30:25;
    if(ea<lim)R.warnings.push({lvl:'bad',txt:`Ta disponibilité énergétique serait de ${Math.round(ea)} kcal par kg de masse maigre. Sous ${lim}${o.sexe==='F'?'':' chez l’homme'}, le risque de blessure, de fatigue chronique et de troubles hormonaux augmente nettement. Réduis le déficit.`});
    else if(ea<30&&o.sexe!=='F')R.warnings.push({lvl:'warn',txt:`Disponibilité énergétique de ${Math.round(ea)} kcal par kg de masse maigre : zone basse. Tenable quelques semaines, surveille ta forme et tes performances.`});}
  if(obj==='perte'&&tr.km>=40&&rate>0.5)R.warnings.push({lvl:'warn',txt:'Avec plus de 40 km de course par semaine, vise au maximum 0,5 % de perte par semaine.'});
  // Jours d'entraînement vs repos
  const trainDayEx=tr.nDays?tr.kcal/tr.nDays:0,restDays=7-tr.nDays;
  const tDay=base+trainDayEx+adj,rDay=base+adj;
  const split=k=>({kcal:k,P,F,C:Math.max(0,(k-P*4-F*9)/4)});
  Object.assign(R,{kg,bmr,bmrSrc,neat,tr,base,exDay,tdee,obj,rate,adj,target,P,F,C,pPerKg:P/kg,ffm,bmi,
    train:split(Math.max(tDay,bmr*1.1)),rest:split(Math.max(rDay,bmr*1.1)),restDays,
    fibres:14*target/1000,eauBase:35*kg,eauEx:tr.nDays?600*tr.hours/tr.nDays:0,
    meals:4,pMeal:Math.max(0.3*kg,P/4)});
  // Ajustement selon la tendance réelle du poids
  const trend=weightTrend(nutriPesees());
  if(trend){R.trend=trend;
    const want=obj==='perte'?-rate/100*kg:obj==='prise'?rate/100*kg:obj==='recompo'?0:0;
    const diff=want-trend.perWeek;
    if(Math.abs(diff)>=0.15){R.adjust=Math.round(diff*7700/7/50)*50;}
  }
  return R;
}

function drawWeightChart(){

  const pz=nutriPesees();
  const logW=S.logs.filter(l=>l.poids).map(l=>({date:l.date,kg:+l.poids}));
  const all=[...pz,...logW.filter(x=>!pz.some(z=>z.date===x.date))].sort((a,b)=>a.date<b.date?-1:1);
  if(!all.length){cv.parentElement.innerHTML='<p class="muted small">Aucune pesée pour l’instant.</p>';return;}
  if(typeof Chart==='undefined'){cv.parentElement.innerHTML='<p class="muted small">Graphique indisponible.</p>';return;}
  const {ink,line,opts}=chartBase();const accent=cssVar('--accent'),warn=cssVar('--warn');
  const avg=all.map((z,i)=>{const d=parseDate(z.date);const win=all.filter(y=>{const k=daysBetween(parseDate(y.date),d);return k>=0&&k<7;});return {x:+d,y:Math.round(win.reduce((s,y)=>s+y.kg,0)/win.length*10)/10};});
  const ds=[{label:'Pesées',data:all.map(z=>({x:+parseDate(z.date),y:z.kg})),borderColor:accent+'66',backgroundColor:accent+'66',pointRadius:3,showLine:false},
    {label:'Moyenne sur 7 jours',data:avg,borderColor:accent,backgroundColor:accent,pointRadius:0,borderWidth:2.5,showLine:true,tension:0.25}];
  const wg=weightGoal();
  if(wg){ds.push({label:'Objectif',data:[{x:+parseDate(all[0].date),y:num(wg.cible)},{x:+wg.dateObj,y:num(wg.cible)}],borderColor:warn,borderDash:[6,5],pointRadius:0,showLine:true,borderWidth:1.5});}
  const o=JSON.parse(JSON.stringify(opts));
  o.scales.x={type:'linear',ticks:{color:ink,callback:v=>fmtDate(new Date(v)),maxTicksLimit:8},grid:{color:line}};
  o.scales.y.ticks.callback=v=>fr(v)+' kg';
  o.plugins.tooltip={callbacks:{title:it=>fmtDateY(new Date(it[0].parsed.x)),label:it=>it.dataset.label+' : '+fr(it.parsed.y)+' kg'}};
  S.charts.push(new Chart(cv,{type:'scatter',data:{datasets:ds},options:o}));
  note.textContent='Points clairs : pesées brutes. Ligne : moyenne glissante sur 7 jours, à regarder en priorité.';
}

    chk('n_age',st.age,14,90,'Âge');chk('n_taille',st.taille,120,230,'Taille');chk('n_bf',st.bf,3,60,'Masse grasse');chk('n_heures',st.heures,0,30,'Heures');
    if(bad)return;
    const ok=await saveNutri(Object.assign({},S.nutri||{},{settings:st,pesees:(S.nutri&&S.nutri.pesees)||[]}));
    toast(ok?'Paramètres enregistrés.':'Paramètres gardés sur ce navigateur.');renderNutrition();});
  wf.addEventListener('submit',async e=>{e.preventDefault();
    document.querySelectorAll('#weighForm .errmsg').forEach(x=>x.textContent='');document.querySelectorAll('#weighForm .err').forEach(x=>x.classList.remove('err'));
    const date=document.getElementById('n_date').value,kg=num(document.getElementById('n_kg').value);let bad=false;
    const d=parseDate(date);if(!d){setErr('n_date','Date obligatoire.');bad=true;}else if(d>today()){setErr('n_date','Pas de pesée dans le futur.');bad=true;}
    if(kg==null){setErr('n_kg','Indique ton poids.');bad=true;}else if(kg<30||kg>200){setErr('n_kg','Entre 30 et 200 kg.');bad=true;}
    if(!bad){const pz=nutriPesees();const last=pz.filter(z=>z.date<date).pop();if(last&&Math.abs(kg-last.kg)/last.kg>0.05&&daysBetween(parseDate(last.date),d)<=7&&!wf.dataset.confirm){setErr('n_kg',`Écart de ${fr(kg-last.kg)} kg avec ta pesée du ${fmtDate(parseDate(last.date))} : vérifie la saisie. Clique de nouveau pour confirmer.`);wf.dataset.confirm='1';return;}}
    if(bad)return;
    const n=Object.assign({settings:{}},S.nutri||{});n.pesees=(n.pesees||[]).filter(z=>z.date!==date).concat([{date,kg}]);
    const ok=await saveNutri(n);toast(ok?'Pesée enregistrée : tes apports sont recalculés.':'Pesée gardée sur ce navigateur.');renderNutrition();});
}

function logItemHtml(l){

      ${fTxt('l_vres','Résultat (si match)',vo.resultat,{ph:'Ex. victoire 3-1'})}

  }
  const opts=near.sort((a,b)=>a.date<b.date?-1:1).map(x=>`<option value="${x.id}" ${x.id===selId?'selected':''}>${fmtDate(parseDate(x.date))} · ${esc(x.title)}</option>`).join('');
  return `<div class="row between"><h3>${L&&!L._new?'Modifier la séance':'Nouvelle saisie'}</h3>${L?`<button type="button" class="btn sm ghost" data-act="cancel-edit">Annuler</button>`:''}</div>
  <form id="logForm" class="stack" novalidate>
    <div class="fields">

      ${!plan?fSel('l_sport','Sport',sport,[['course','Course à pied'],['sw','Street workout'],['volley','Volley'],['general','Autre (mobilité, vélo…)']]):''}
      ${!plan?fTxt('l_title','Intitulé',L?L.title:'',{ph:'Ex. Footing libre'}):''}
      ${fSel('l_statut','Statut',v('statut','realisee'),[['realisee','Réalisée comme prévu'],['partielle','Réalisée en partie'],['annulee','Annulée / non faite']])}

function bandChips(id,sel){sel=sel||[];return `<div class="bandchips" data-target="${id}" role="group" aria-label="Élastiques accrochés">${SW_PACK.map((kg,i)=>`<button type="button" class="chip ${sel.includes(i)?'on':''}" data-bandchip="${i}" aria-pressed="${sel.includes(i)}">${kg} kg</button>`).join('')}<input type="hidden" id="${id}" value="${sel.join(',')}"><b class="num" data-total>${bandsSum(sel)} kg</b></div>`;}
function readChips(id){const e=document.getElementById(id);if(!e||e.value==='')return [];return e.value.split(',').map(Number).filter(n=>n>=0&&n<SW_PACK.length);}
function bindLogForm(){
  const f=document.getElementById('logForm');if(!f)return;
  const upd=()=>{const d=num(document.getElementById('l_dist')?.value),t=parseTime(document.getElementById('l_temps')?.value);const pe=document.getElementById('l_pace');if(pe)pe.textContent=d&&t?fmtPace(t/d):'—';};
  upd();
  f.addEventListener('input',e=>{
    if(e.target.id==='l_dist'||e.target.id==='l_temps')upd();
    if(e.target.id==='l_rpe')document.getElementById('l_rpe_v').textContent=e.target.value;
    if(e.target.id==='l_douleur')document.getElementById('l_douleur_v').textContent=e.target.value;
  });
  f.addEventListener('change',e=>{
    if(e.target.id==='l_plan'){const s=allSessions().find(x=>x.id===e.target.value);S.draftSession=s?{id:s.id,date:s.date}:{id:'',date:document.getElementById('l_date').value};if(S.editLog){S.editLog=Object.assign({},S.editLog,{plannedId:s?s.id:null,plan:planSnapshot(s),date:s?s.date:S.editLog.date});}refreshLogForm();}
    if(e.target.id==='l_date'){S.draftSession={id:'',date:e.target.value};if(S.editLog)S.editLog=Object.assign({},S.editLog,{date:e.target.value});refreshLogForm();}
    if(e.target.id==='l_sport'){S.freeSport=e.target.value;if(S.editLog)S.editLog=Object.assign({},S.editLog,{sport:e.target.value});refreshLogForm();}
  });
  f.addEventListener('submit',e=>{e.preventDefault();submitLog();});
}
function refreshLogForm(){const c=document.getElementById('logFormCard');if(!c)return;c.innerHTML=logFormHtml();bindLogForm();}
function setErr(id,m){const e=document.getElementById(id+'_e');if(e)e.textContent=m;const i=document.getElementById(id);if(i)i.classList.add('err');}
async function submitLog(){
  document.querySelectorAll('#logForm .errmsg').forEach(e=>e.textContent='');document.querySelectorAll('#logForm .err').forEach(e=>e.classList.remove('err'));
  const g=id=>{const e=document.getElementById(id);return e?e.value:'';};
  const L=S.editLog;
  const sess=allSessions().find(x=>x.id===g('l_plan'))||null;
  const plan=L&&L.plan&&L.plannedId===g('l_plan')?L.plan:planSnapshot(sess);
  const sport=plan?plan.sport:g('l_sport')||'general';
  const kind=plan?plan.log:({course:'run',sw:'sw',volley:'volley',general:'free'}[sport]);
  const statut=g('l_statut');
  let bad=false;const E=(id,m)=>{setErr(id,m);bad=true;};
  const date=g('l_date');const dd=parseDate(date);
  if(!dd)E('l_date','Date obligatoire.');else if(dd>today())E('l_date','Impossible de saisir une séance future.');
  const rec={id:L?L.id:uid(),createdAt:L?L.createdAt:Date.now(),date,plannedId:plan?(sess?sess.id:L&&L.plannedId):null,plan,sport,title:plan?plan.title:(g('l_title')||'Séance libre'),statut,
    dureeMin:num(g('l_duree')),rpe:num(g('l_rpe')),sommeil:num(g('l_sommeil')),forme:num(g('l_forme')),douleur:num(g('l_douleur')),douleurZone:g('l_dzone'),poids:num(g('l_poids')),notes:g('l_notes').trim()};
  const chkRange=(id,val,a,b,lab)=>{if(val!=null&&(val<a||val>b))E(id,`${lab} entre ${a} et ${b}.`);};
  if(statut!=='annulee'){
    if(rec.dureeMin==null)E('l_duree','Indique la durée.');chkRange('l_duree',rec.dureeMin,1,600,'Durée');
  }
  chkRange('l_sommeil',rec.sommeil,0,14,'Sommeil');chkRange('l_poids',rec.poids,30,200,'Poids');
  if(rec.douleur>0&&!rec.douleurZone)E('l_dzone','Précise la zone de la douleur.');
  if(kind==='run'){
    const dist=num(g('l_dist')),t=g('l_temps')?parseTime(g('l_temps')):null;
    if(statut!=='annulee'){
      if(dist==null)E('l_dist','Distance obligatoire.');else chkRange('l_dist',dist,0.1,120,'Distance');
      if(g('l_temps')&&!t)E('l_temps','Format h:mm:ss ou mm:ss.');
      if(dist&&t){const pace=t/dist;if(pace<150||pace>1200)E('l_temps',`Allure de ${fmtPace(pace)} incohérente : vérifie la durée.`);}
    }
    const fcm=num(g('l_fcMoy')),fcx=num(g('l_fcMax'));chkRange('l_fcMoy',fcm,60,230,'FC moyenne');chkRange('l_fcMax',fcx,80,230,'FC max');
    if(fcm&&fcx&&fcm>fcx)E('l_fcMax','La FC max doit être supérieure ou égale à la FC moyenne.');
    rec.run={distance:dist,dureeSec:t,fcMoy:fcm,fcMax:fcx,dplus:num(g('l_dplus')),fractions:g('l_fractions')};
    if(plan&&plan.repsN){const reps=[];for(let j=0;j<plan.repsN;j++){const v=g('l_rep_'+j);if(!v){reps.push(null);continue;}const sec=parseTime(v);const d=plan.repDist||0.8;if(!sec||sec/d<150||sec/d>900){E('l_rep','Temps de répétition invalide (format mm:ss, ex. 4:52).');document.getElementById('l_rep_'+j).classList.add('err');reps.push(null);}else reps.push(sec);}rec.run.reps=reps;
      if(statut==='realisee'&&reps.every(x=>x==null))E('l_rep','Saisis le temps de tes répétitions : c’est ce qui recalcule tes allures.');}
    if(plan&&plan.testDist&&g('l_chrono')){const c=parseTime(g('l_chrono'));if(!c)E('l_chrono','Format mm:ss ou h:mm:ss.');else{const pace=c/plan.testDist;if(pace<150||pace>900)E('l_chrono',`Allure de ${fmtPace(pace)} incohérente.`);else rec.tests={run:{dist:plan.testDist,sec:c}};}}
    if(t&&rec.dureeMin&&t/60>rec.dureeMin+1)E('l_duree','La durée totale ne peut pas être inférieure à la durée de course.');
  }else if(kind==='sw'){
    const sets=[];
    document.querySelectorAll('#l_sets [data-ex]').forEach(div=>{const i=div.dataset.ex;const nom=(document.getElementById('l_exnom_'+i)||{}).value||'';
      const pe=plan?plan.blocks.filter(b=>b.t==='ex')[i]:null;const unite=pe?pe.unite:(document.getElementById('l_exunit_'+i)||{}).value||'reps';
      const vals=[...div.querySelectorAll('.sets input')].map(x=>{const n=num(x.value);if(x.value!==''&&(n==null||n<0||n>500)){x.classList.add('err');bad=true;}return x.value===''?null:n;});
      const lestEl=document.getElementById('l_lest_'+i);const lest=lestEl?num(lestEl.value):null;
      const hasChips=!!document.getElementById('l_bands_'+i);const bandsSel=hasChips?readChips('l_bands_'+i):null;const res=hasChips?(bandsSel.length?bandsSum(bandsSel):null):null;
      const bandEl=document.getElementById('l_band_'+i);const band=bandEl?bandEl.value:null;
      if(nom||vals.some(v=>v!=null))sets.push({nom:nom||'Exercice',unite,cible:pe?pe.cible:null,vals,lest,band,res,bands:bandsSel});
      if(!nom&&vals.some(v=>v!=null)&&!pe){setErr('l_exnom_'+i,'');document.getElementById('l_exnom_'+i).classList.add('err');bad=true;}
    });
    if(statut==='realisee'&&!sets.some(s=>s.vals.some(v=>v!=null)))E('l_global','Saisis au moins une série réalisée, ou passe le statut en « Annulée ».');
    rec.sets=sets;
  }else if(kind==='volley'){
    rec.volley={type:g('l_vtype'),sauts:num(g('l_vsauts')),resultat:g('l_vres')};chkRange('l_vsauts',rec.volley.sauts,0,500,'Sauts');
  }else if(kind==='test'&&plan&&plan.tests){
    rec.tests={};
    for(const k of plan.tests){const val=g('l_t_'+k);if(val==='')continue;const n=num(val);if(n==null||n<0||n>600){E('l_t_'+k,'Valeur invalide.');continue;}rec.tests[k]=n;}
    if(statut!=='annulee'&&!Object.keys(rec.tests).length)E('l_global','Saisis au moins un résultat de test.');
  }
  if(statut!=='annulee'&&!rec.rpe)E('l_rpe','Indique l’effort ressenti.');
  if(bad){const ge=document.getElementById('l_global_e');if(ge&&!ge.textContent)ge.textContent='Corrige les champs en rouge.';return;}
  const okSave=await saveLog(rec);
  S.editLog=null;S.draftSession=null;
  toast(okSave?'Séance enregistrée.':'Séance gardée sur ce navigateur.');
  if(rec.tests&&Object.keys(rec.tests).length)toast('Test enregistré : tes charges et ta courbe sont mises à jour.');
  render();
}

  const t=today(),st=addDays(mondayOf(t),-42);
  return {prenom:'Alex (exemple)',age:31,sexe:'H',taille:180,poids:78,fcRepos:54,fcMax:190,sommeil:7,stress:'3',metier:'sedentaire',blessures:['epaule'],blessureDetail:'',douleur:0,medical:'non',
    debut:toStr(st),jours:['lun','mar','jeu','sam','dim'],seancesMax:7,dureeMax:75,dureeWE:120,creneau:'soir',doubles:true,materiel:['barre','paralleles','elastiques','lest','smartworkout'],elastiques:[{id:'bj',nom:'Jaune',min:2,max:7},{id:'br',nom:'Rouge',min:7,max:16},{id:'bn',nom:'Noir',min:11,max:23},{id:'bv',nom:'Violet',min:16,max:36}],trAssBand:'bn',trAssReps:'14',elasUsage:['tractions','dips','muscleup','frontlever','planche','echauffement'],
    swAnc:'2-5',tractions:11,dips:18,pompes:35,muscleup:0,fl:1,planche:0,handstandMur:30,handstand:3,lsit:10,pistol:'aide',
    runAnc:'2-5',kmSemaine:18,runSeances:2,sortieLongue:10,ref5:'24:30',refAge:'1',semaine:JSON.parse(JSON.stringify(DEFAULT_WEEK)),
    vNiveau:'departemental',vPoste:'attaquant',vClubJours:['mer'],vDuree:120,vMatchJours:[],vDetente:52,
    objectifs:[{id:'d1',type:'run10',cible:'49:30',date:toStr(addDays(t,63)),priorite:'principal'},{id:'d2',type:'pullups',cible:'16',date:toStr(addDays(t,90)),priorite:'secondaire'},{id:'d3',type:'jump',cible:'58',date:toStr(addDays(t,120)),priorite:'secondaire'}],
    savedAt:new Date(st).toISOString()};
}
function demoLogs(p){
  const prog=buildProgram(p,[]);const ts=toStr(today());const logs=[];let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  let pu=11,dp=18,run5=1470,jp=52;
  for(const w of prog.weeks)for(const s of w.sessions){
    if(s.date>=ts)continue;
    const skip=rnd()<0.1;const id='demo'+logs.length;
    const base={id,createdAt:Date.now(),date:s.date,plannedId:s.id,plan:planSnapshot(s),sport:s.sport,title:s.title,statut:skip?'annulee':'realisee',dureeMin:s.dureeMin,rpe:skip?null:clamp(Math.round((s.intensite==='Facile'?4:s.intensite==='Modérée'?6:7.5)+rnd()*1.5-0.5),1,10),sommeil:Math.round((6.5+rnd()*1.5)*2)/2,forme:String(clamp(Math.round(3+rnd()*1.6-0.5),1,5)),douleur:0,douleurZone:'',poids:rnd()<0.3?Math.round((78-w.index*0.1+rnd()*0.4)*10)/10:null,notes:''};
    if(!skip){
      if(s.log==='run'&&s.repsN){const km=s.plannedKm;const p5=runFitness(p,logs,s.date).p5;base.rpe=7;base.run={distance:km,dureeSec:Math.round(km*p5*1.15),fcMoy:150,fcMax:178,dplus:20,fractions:'complet',reps:Array.from({length:s.repsN},()=>Math.round(p5*s.repDist*(0.975+rnd()*0.02)))};}
      else if(s.log==='run'){const km=s.plannedKm||6;const pace=prog.A.efPace*(s.intensite==='Facile'?1:0.88);base.run={distance:km,dureeSec:Math.round(km*pace),fcMoy:140+Math.round(rnd()*15),fcMax:165+Math.round(rnd()*15),dplus:Math.round(rnd()*60),fractions:s.intensite==='Facile'?'na':'complet'};
        if(s.testDist){run5-=25+rnd()*15;base.tests={run:{dist:s.testDist,sec:Math.round(s.testDist===5?run5:riegel(run5,5,s.testDist))}};}}
      else if(s.log==='sw'){base.rpe=7;base.sets=s.blocks.filter(b=>b.t==='ex').map(b=>({nom:b.nom,unite:b.unite,cible:b.cible,res:b.resKg||null,bands:b.bandsIdx||null,vals:Array.from({length:b.series},()=>b.hi&&rnd()<0.5?b.hi:Math.max(1,b.cible-(rnd()<0.3?1:0))),lest:b.lest?7.5:null}));}
      else if(s.log==='volley'){base.volley={type:'entrainement',sauts:60+Math.round(rnd()*40),resultat:''};}
      else if(s.log==='test'){base.tests={};for(const k of s.tests){if(k==='pullups'){pu+=1;base.tests.pullups=pu;}else if(k==='dips'){dp+=2;base.tests.dips=dp;}else if(k==='jump'){jp+=1.5;base.tests.jump=jp;}}}
    }
    logs.push(base);
  }
  return logs;
}
function demoNutri(){const t=today();const pz=[];let kg=78.6,seed=3;const r=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  for(let d=-42;d<=0;d+=2){kg-=0.07;pz.push({date:toStr(addDays(t,d)),kg:Math.round((kg+r()*0.8-0.4)*10)/10});}
  return {settings:{objectif:'perte',rythme:'0.5',bf:'16'},pesees:pz};}
function demoExtra(){return emptyExtra();}
function enterDemo(){S.saved={profile:S.profile,logs:S.logs,nutri:S.nutri,extra:S.extra};S.demo=true;S.extra=demoExtra();const p=demoProfile();S.profile=p;S.logs=demoLogs(p);S.nutri=demoNutri();S.qDraft=null;S.qAnalysis=null;S.weekSel=null;recompute();S.view='tableau';render();}
function exitDemo(){S.demo=false;S.extra=S.saved.extra||emptyExtra();S.profile=S.saved.profile;S.logs=S.saved.logs||[];S.nutri=S.saved.nutri||{settings:{},pesees:[]};S.qDraft=null;S.qAnalysis=null;S.weekSel=null;recompute();render();}

/* ==========================================================================
   11. ÉVÉNEMENTS
   ========================================================================== */
function go(view){S.view=view;if(location.hash!=='#'+view)history.replaceState(null,'','#'+view);render();window.scrollTo({top:0});}
function initUI(){
  const h=(location.hash||'').slice(1);if(['tableau','questionnaire','programme','suivi','nutrition'].includes(h))S.view=h;
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['tableau','questionnaire','programme','suivi','nutrition'].includes(v)&&v!==S.view){S.view=v;render();}});
  document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)go(b.dataset.view);});
  document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('open'))closeModal();});
  document.body.addEventListener('click',onClick);
  document.body.addEventListener('change',onChange);
  document.body.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('[data-band]'))refreshBandSelects();if(e.target.id==='q_douleur'){const o=document.getElementById('q_douleur_v');if(o)o.textContent=e.target.value;}});
  if(window.matchMedia){const mq=window.matchMedia('(prefers-color-scheme: dark)');const r=()=>{if(S.view==='tableau'||S.view==='nutrition')render();};if(mq.addEventListener)mq.addEventListener('change',r);}
  new MutationObserver(()=>{if(S.view==='tableau'||S.view==='nutrition')render();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}
function onChange(e){
  const t=e.target;
  if(t.id==='restoreFile'){const fl=t.files&&t.files[0];if(fl)restoreBackup(fl);return;}
  if(t.id==='cg'){S.chartGoal=t.value;render();}
  if(t.id==='logFilter'){S.logFilter=t.value;render();}
  if(t.dataset&&t.dataset.goalType!=null){readQForm();const d=draft();const i=+t.dataset.goalType;d.objectifs[i].type=t.value;d.objectifs[i].cible='';renderQuestionnaire();}
}
async function onClick(e){
  const b=e.target.closest('button,[data-goto]');if(!b)return;
  const ds=b.dataset;
  if(ds.goto){go(ds.goto);return;}
  if(ds.step!=null){readQForm();S.qStep=+ds.step;renderQuestionnaire();return;}
  if(ds.week){S.weekSel=+ds.week;renderProgramme();return;}
  if(ds.sess){const s=allSessions().find(x=>x.id===ds.sess);if(s)openModal(sessionDetailHtml(s));return;}
  if(ds.viewplan){const s=allSessions().find(x=>x.id===ds.viewplan);if(s)openModal(sessionDetailHtml(s));return;}
  if(ds.log){closeModal();const s=allSessions().find(x=>x.id===ds.log);S.editLog=null;S.draftSession=s?{id:s.id,date:s.date<=toStr(today())?s.date:toStr(today())}:null;
    if(s&&s.date>toStr(today())){toast('Cette séance est prévue plus tard : tu pourras la saisir le jour même.');return;}
    go('suivi');return;}
  if(ds.editlog){closeModal();S.editLog=JSON.parse(JSON.stringify(S.logs.find(l=>l.id===ds.editlog)));S.draftSession=null;go('suivi');return;}
  if(ds.dellog){const id=ds.dellog;openModal(`<h3>Supprimer cette séance ?</h3><p>La saisie sera définitivement effacée, ainsi que ses résultats de tests.</p><div class="row"><button class="btn danger" data-confirmdel="${id}">Supprimer</button><button class="btn" data-act="close">Garder</button></div>`);return;}
  if(ds.confirmdel){closeModal();await deleteLog(ds.confirmdel);S.editLog=null;toast('Séance supprimée.');render();return;}
  if(ds.delpesee){const n=Object.assign({settings:{}},S.nutri||{});n.pesees=(n.pesees||[]).filter(z=>z.date!==ds.delpesee);await saveNutri(n);toast('Pesée supprimée.');renderNutrition();return;}
  if(ds.liveStart){startLive(ds.liveStart);return;}
  if(ds.live){if(ds.live==='resume'){openLive();return;}liveAction(ds.live);return;}
  if(ds.move){const s=allSessions().find(x=>x.id===ds.move);if(s)openModal(moveModalHtml(s));return;}
  if(ds.moveto){const [id,dt]=ds.moveto.split('|');const X=getExtra();X.overrides=Object.assign({},X.overrides);if(dt==='reset')delete X.overrides[id];else X.overrides[id]=dt;closeModal();await saveExtra(X);toast(dt==='reset'?'Séance remise à son jour.':'Séance déplacée au '+fmtDateLong(parseDate(dt))+'.');render();return;}
  if(ds.skip){const s=allSessions().find(x=>x.id===ds.skip);closeModal();if(s){const ts=toStr(today());await saveLog({id:uid(),createdAt:Date.now(),date:s.date<ts?s.date:ts,plannedId:s.id,plan:planSnapshot(s),sport:s.sport,title:s.title,statut:'annulee',dureeMin:null,rpe:null,notes:'Annulée depuis le programme'});toast('Séance annulée. Elle compte comme non faite dans ton assiduité.');render();}return;}
  if(ds.light){const X=getExtra();X.light=Object.assign({},X.light,{[ds.light]:true});closeModal();await saveExtra(X);toast('Version allégée appliquée à la séance du jour.');render();return;}
  if(ds.unlight){const X=getExtra();X.light=Object.assign({},X.light);delete X.light[ds.unlight];closeModal();await saveExtra(X);toast('Séance prévue rétablie.');render();return;}
  if(ds.export){b.disabled=true;await doExport(ds.export);b.disabled=false;return;}
  if(ds.bandchip!=null){const box=b.closest('.bandchips');b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'));const sel=[...box.querySelectorAll('.chip.on')].map(x=>+x.dataset.bandchip);box.querySelector('input').value=sel.join(',');box.querySelector('[data-total]').textContent=bandsSum(sel)+' kg';return;}
  if(ds.addset!=null){const div=document.querySelector(`[data-ex="${ds.addset}"] .sets`);const n=div.querySelectorAll('input').length;const inp=document.createElement('input');inp.type='number';inp.min='0';inp.max='500';inp.step='1';inp.id=`l_set_${ds.addset}_${n}`;inp.setAttribute('aria-label','Série '+(n+1));inp.placeholder='S'+(n+1);div.insertBefore(inp,b);inp.focus();return;}
  switch(ds.act){
    case 'close':closeModal();break;
    case 'export':openModal(exportModalHtml());break;
    case 'confirm-restore':await applyRestore();break;

    case 'demo':enterDemo();break;
    case 'exit-demo':exitDemo();break;
    case 'new-log':S.editLog=null;S.draftSession=null;go('suivi');break;
    case 'cancel-edit':S.editLog=null;S.draftSession=null;render();break;
    case 'add-ex':{const c=document.getElementById('l_sets');const i=c.querySelectorAll('[data-ex]').length;const div=document.createElement('div');div.className='blk stack';div.dataset.ex=i;
      div.innerHTML=`<div class="fields"><div class="f"><label for="l_exnom_${i}">Exercice</label><input type="text" id="l_exnom_${i}" placeholder="Ex. Dips"><span class="errmsg" id="l_exnom_${i}_e"></span></div>${fSel('l_exunit_'+i,'Unité','reps',[['reps','Répétitions'],['s','Secondes']])}</div><div class="sets">${[0,1,2,3].map(j=>`<input type="number" min="0" max="500" step="1" id="l_set_${i}_${j}" aria-label="Série ${j+1}" placeholder="S${j+1}">`).join('')}<button type="button" class="btn sm" data-addset="${i}">+ série</button></div>`;
      c.insertBefore(div,b);div.querySelector('input').focus();break;}
    case 'add-band':{readQForm();const d=draft();d.elastiques=d.elastiques||[];d.elastiques.push({id:uid(),nom:'',min:'',max:''});renderQuestionnaire();const n=document.getElementById('b_nom_'+(d.elastiques.length-1));if(n)n.focus();break;}
    case 'del-band':{readQForm();const d=draft();const gone=d.elastiques.splice(+ds.i,1)[0];if(gone){if(d.trAssBand===gone.id)d.trAssBand='';if(d.dpAssBand===gone.id)d.dpAssBand='';}renderQuestionnaire();break;}
    case 'add-goal':{readQForm();const d=draft();d.objectifs=d.objectifs||[];d.objectifs.push({id:uid(),type:'run10',cible:'',date:'',priorite:d.objectifs.length?'secondaire':'principal'});renderQuestionnaire();break;}
    case 'del-goal':{readQForm();const d=draft();d.objectifs.splice(+ds.i,1);renderQuestionnaire();break;}
    case 'q-prev':readQForm();S.qStep=Math.max(0,S.qStep-1);renderQuestionnaire();window.scrollTo({top:0});break;
    case 'q-next':{const d=readQForm();const errs=validateQ(d,S.qStep);if(Object.keys(errs).length){showErrs(errs);toast('Corrige les champs en rouge pour continuer.');return;}S.qStep=Math.min(STEPS.length-1,S.qStep+1);renderQuestionnaire();window.scrollTo({top:0});break;}
    case 'q-analyze':{const d=readQForm();const errs=validateQ(d);if(Object.keys(errs).length){const first=Object.keys(errs)[0];S.qStep=stepOfErr(first);renderQuestionnaire();showErrs(errs);toast('Certaines réponses sont incomplètes ou incohérentes.');return;}
      const p=Object.assign({},d,{savedAt:new Date().toISOString()});const cur=currentMetrics(p,[]);S.qAnalysis=analyze(p,cur);renderQuestionnaire();const a=document.getElementById('analysis');if(a)a.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'q-save':{const d=readQForm();const errs=validateQ(d);if(Object.keys(errs).length){toast('Certaines réponses sont incomplètes.');return;}
      const p=JSON.parse(JSON.stringify(Object.assign({},d,{savedAt:new Date().toISOString()})));
      const ok=await saveProfile(p);S.qDraft=null;S.qAnalysis=null;S.qStep=0;S.weekSel=null;
      toast(ok?'Programme généré et enregistré.':'Programme généré (sauvegarde locale).');go('programme');break;}
  }
}
