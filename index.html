<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub sportif</title>
<meta name="hub-standalone" content="1">
<meta name="theme-color" content="#121A26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub sportif">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Plan : outil de coaching. Bandeau sombre façon tableau d'affichage, cartes claires, une couleur par sport
   (course = rouge tartan, street workout = vert craie, volley = jaune ballon), bleu terrain pour l'interface. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#121820; --muted:#5A6573; --line:#D9DFE6;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --band:#121A26; --band-ink:#F2F5F9;
  --run:#D9432A; --sw:#0E8574; --volley:#D69C00; --gen:#1F4FD1;
  --ok:#1A7F48; --warn:#B9740B; --bad:#C2302A; --ok-bg:#E3F3EA; --warn-bg:#FBF0DC; --bad-bg:#FAE3E1;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  --radius:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E131A; --surface:#161D27; --surface-2:#1C2531; --ink:#E8EDF3; --muted:#97A3B2; --line:#2A3542;
    --accent:#6E93FF; --accent-ink:#0B1220; --band:#0A0F15; --band-ink:#E8EDF3;
    --run:#FF6A4D; --sw:#2DC2A8; --volley:#F2BE2E; --gen:#6E93FF;
    --ok:#4CC27F; --warn:#E9A53A; --bad:#FF6B63; --ok-bg:#15301F; --warn-bg:#33270F; --bad-bg:#3A1A18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface-2:#1C2531; --ink:#E8EDF3; --muted:#97A3B2; --line:#2A3542;
  --accent:#6E93FF; --accent-ink:#0B1220; --band:#0A0F15; --band-ink:#E8EDF3;
  --run:#FF6A4D; --sw:#2DC2A8; --volley:#F2BE2E; --gen:#6E93FF;
  --ok:#4CC27F; --warn:#E9A53A; --bad:#FF6B63; --ok-bg:#15301F; --warn-bg:#33270F; --bad-bg:#3A1A18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.75rem;font-weight:700;text-transform:uppercase}
h3{font-size:1.25rem;font-weight:600}
h4{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Bandeau */
.top{background:var(--band);color:var(--band-ink)}
.top-in{max-width:1180px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:2rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.brand .stripes{display:inline-flex;gap:4px;align-self:center}
.brand .stripes i{display:block;width:6px;height:22px;border-radius:2px;transform:skewX(-14deg)}
.brand small{color:#9FB0C4;font-size:.9rem}
.sync{font-size:.8rem;padding:4px 10px;border-radius:999px;border:1px solid #33445A;color:#C7D3E0;white-space:nowrap}
.sync.ok{border-color:#2F6B4A;color:#8FE0B0}
.sync.local{border-color:#6B5A2F;color:#F0CF83}
.sync.demo{border-color:#5A4FB0;color:#C5BEFF}
.tabs{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;color:#B9C6D6;padding:10px 14px 12px;font-family:var(--font-display);font-size:1.1rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab[aria-current="page"]{color:#fff;border-bottom-color:var(--volley)}

main{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.card.flat{background:var(--surface-2)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.card,.grid>*{min-width:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.tiny{font-size:.78rem}
.eyebrow{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.08em;font-size:.85rem;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.875rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tag::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c,var(--gen));transform:skewX(-14deg)}
.s-course{--c:var(--run)} .s-sw{--c:var(--sw)} .s-volley{--c:var(--volley)} .s-general{--c:var(--gen)}

.notice{border-left:4px solid var(--c,var(--accent));background:var(--surface);border-radius:8px;padding:12px 14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.notice.warn{--c:var(--warn)} .notice.bad{--c:var(--bad)} .notice.ok{--c:var(--ok)}

/* KPI */
.kpi .v{font-family:var(--font-display);font-size:2.3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:1rem;color:var(--muted);font-weight:600}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--accent))}

/* Formulaires */
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.9rem;cursor:pointer}
.step[aria-current="step"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.step .n{font-variant-numeric:tabular-nums;color:var(--muted);margin-right:4px}
.step[aria-current="step"] .n{color:inherit;opacity:.7}
fieldset{border:0;margin:0;padding:0;display:grid;gap:16px}
legend{padding:0}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.f{display:grid;gap:5px;align-content:start}
.f label,.f .lbl{font-weight:600;font-size:.92rem}
.f .hint{font-size:.8rem;color:var(--muted)}
.f.wide{grid-column:1/-1}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input.err,select.err,textarea.err{border-color:var(--bad);background:var(--bad-bg)}
.errmsg{color:var(--bad);font-size:.82rem;font-weight:600}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;background:var(--surface);font-size:.92rem}
.chk:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.chk input{accent-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.bandrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
@media (max-width:820px){.bandrow{grid-template-columns:1fr 1fr}.bandrow .f:first-child{grid-column:1/-1}}
.goalrow{display:grid;grid-template-columns:2.2fr 1.3fr 1.2fr 1.1fr auto;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
@media (max-width:820px){.goalrow{grid-template-columns:1fr 1fr}.goalrow .f:first-child{grid-column:1/-1}}

/* Programme */
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weekstrip{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.wk{min-width:30px;height:34px;border-radius:4px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.75rem;font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative}
.wk.deload{background:var(--surface-2);border-style:dashed}
.wk.taper{border-color:var(--run)}
.wk.cur{outline:2px solid var(--accent)}
.wk[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wk .dot{position:absolute;bottom:2px;width:5px;height:5px;border-radius:50%;background:var(--volley)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media (max-width:980px){.days{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day h4{display:flex;justify-content:space-between;align-items:baseline}
.sess{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:8px;background:var(--surface-2);cursor:pointer;text-align:left;display:grid;gap:3px;width:100%}
.sess:hover{border-color:var(--c)}
.sess .t{font-weight:700;font-size:.92rem;line-height:1.25}
.sess .m{font-size:.78rem;color:var(--muted)}
.sess.done{opacity:.75}
.sess .st{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.st.done{color:var(--ok)} .st.miss{color:var(--bad)} .st.part{color:var(--warn)}
.blocks{display:grid;gap:8px}
.blk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.blk .h{font-weight:700}
table.ex{width:100%;border-collapse:collapse;font-size:.92rem}
table.ex th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 6px}
table.ex td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
.tblwrap{overflow-x:auto}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(8,12,18,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto;z-index:20}
#modal.open{display:flex}
.modal-box{background:var(--surface);border-radius:12px;max-width:760px;width:100%;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
#live{position:fixed;inset:0;background:var(--bg);z-index:25;overflow-y:auto}
#live[hidden]{display:none}
.live-in{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));display:grid;gap:16px;min-height:100%;align-content:start}
.live-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.live-ex{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.1;text-wrap:balance}
.live-big{font-family:var(--font-display);font-size:5.5rem;font-weight:700;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.live-big small{font-size:1.6rem;color:var(--muted)}
.stepper{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;align-items:center}
.stepper button{font-size:2rem;font-weight:700;min-height:72px;border-radius:12px;justify-content:center}
.btn.xl{width:100%;justify-content:center;min-height:64px;font-size:1.25rem;border-radius:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}
.dots i.done{background:var(--ok);border-color:var(--ok)}
.dots i.miss{background:var(--bad);border-color:var(--bad)}
.dots i.cur{border-color:var(--accent)}
.restbar{height:12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.restbar>i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.bandchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.chip.on{background:var(--sw);border-color:var(--sw);color:#fff}
#live .chip{padding:10px 14px;font-size:1rem}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;display:none;z-index:30;max-width:90vw}
#toast.show{display:block}

/* Journal */
.loglist{display:grid;gap:8px}
.logitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface)}
.logitem .d{font-family:var(--font-display);font-weight:700;text-align:center;line-height:1.05;min-width:44px}
.logitem .d b{display:block;font-size:1.4rem}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.sets input{width:74px}
.chartbox{position:relative;height:280px;width:100%;min-width:0}
.feas{display:grid;gap:10px}
.feasitem{border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;background:var(--surface)}
details summary{cursor:pointer;font-weight:600}
.empty{text-align:center;padding:40px 18px;display:grid;gap:12px;justify-items:center}
.empty h2{font-size:2rem}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="stripes" aria-hidden="true"><i style="background:var(--run)"></i><i style="background:var(--sw)"></i><i style="background:var(--volley)"></i></span>
      <h1>Hub sportif</h1>
      <small>Street workout · Volley · Course à pied</small>
    </div>
    <span id="sync" class="sync">Chargement…</span>
  </div>
  <nav class="tabs" aria-label="Sections">
    <button class="tab" data-view="tableau">Tableau de bord</button>
    <button class="tab" data-view="questionnaire">Questionnaire</button>
    <button class="tab" data-view="programme">Programme</button>
    <button class="tab" data-view="suivi">Suivi des séances</button>
    <button class="tab" data-view="nutrition">Nutrition</button>
  </nav>
</header>
<main id="app"></main>
<p class="tiny muted" style="text-align:center;padding:8px 16px 28px">Version du 21 nov. 2026 · n° 3</p>
<div id="modal" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="live" role="dialog" aria-modal="true" aria-label="Séance en cours" hidden></div>

<script>
'use strict';
const STANDALONE=typeof document!=='undefined'&&!!document.querySelector('meta[name="hub-standalone"]');
/* ==========================================================================
   1. UTILITAIRES
   ========================================================================== */
const DAY_KEYS=['lun','mar','mer','jeu','ven','sam','dim'];
const DAY_NAMES=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const DAY_SHORT=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const MONTHS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const pad=n=>String(n).padStart(2,'0');
const toStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function parseDate(s){if(!s)return null;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d)?null:d;}
function today(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function addDays(d,n){const r=new Date(d.getFullYear(),d.getMonth(),d.getDate());r.setDate(r.getDate()+n);return r;}
const dayIdx=d=>(d.getDay()+6)%7;
const mondayOf=d=>addDays(d,-dayIdx(d));
const daysBetween=(a,b)=>Math.round((b-a)/86400000);
const fmtDate=d=>d.getDate()+' '+MONTHS[d.getMonth()];
const fmtDateY=d=>d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
const fmtDateLong=d=>DAY_NAMES[dayIdx(d)].toLowerCase()+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
function parseTime(s){
  if(s==null)return null; s=String(s).trim().toLowerCase().replace(/\s/g,''); if(!s)return null;
  let m=/^(\d{1,2})h(\d{1,2})?(?:min|m)?$/.exec(s); if(m){const mm=+(m[2]||0);if(mm>59)return null;return +m[1]*3600+mm*60;}
  m=/^(\d{1,3}):(\d{2})$/.exec(s); if(m){if(+m[2]>59)return null;return +m[1]*60+ +m[2];}
  m=/^(\d{1,2}):(\d{2}):(\d{2})$/.exec(s); if(m){if(+m[2]>59||+m[3]>59)return null;return +m[1]*3600+ +m[2]*60+ +m[3];}
  return null;
}
function fmtTime(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?h+':'+pad(m)+':'+pad(s):m+':'+pad(s);}
const fmtPace=spk=>fmtTime(spk)+' /km';
const fr=(n,d=1)=>Number(n).toLocaleString('fr-FR',{maximumFractionDigits:d,minimumFractionDigits:0});
const num=v=>{if(v===''||v==null)return null;const n=Number(String(v).replace(',','.'));return isFinite(n)?n:null;};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function riegel(t1,d1,d2){return t1*Math.pow(d2/d1,1.06);}

/* ==========================================================================
   2. RÉFÉRENTIEL D'OBJECTIFS
   ========================================================================== */
const FL_STAGES=['Aucun','Tuck','Advanced tuck','Une jambe tendue','Straddle','Complet'];
const PL_STAGES=['Aucun','Planche lean','Tuck','Advanced tuck','Straddle','Complète'];
const SPORT_LABEL={course:'Course à pied',sw:'Street workout',volley:'Volley',general:'Général'};
const GOALS={
  run5:{sport:'course',kind:'time',label:'Courir 5 km en…',dist:5,taper:1,peak:25,long:10,minW:4,ph:'mm:ss (ex. 22:30)'},
  run10:{sport:'course',kind:'time',label:'Courir 10 km en…',dist:10,taper:1,peak:35,long:14,minW:6,ph:'mm:ss (ex. 47:00)'},
  run21:{sport:'course',kind:'time',label:'Semi-marathon en…',dist:21.0975,taper:2,peak:45,long:20,minW:10,ph:'h:mm:ss (ex. 1:45:00)'},
  run42:{sport:'course',kind:'time',label:'Marathon en…',dist:42.195,taper:3,peak:60,long:32,minW:16,ph:'h:mm:ss (ex. 3:45:00)'},
  runFinish:{sport:'course',kind:'finish',label:'Terminer une course de… (km)',unit:'km',ph:'ex. 21,1'},
  runVolume:{sport:'course',kind:'volume',label:'Courir… km par semaine',unit:'km/sem.',ph:'ex. 40'},
  pullups:{sport:'sw',kind:'reps',label:'Tractions strictes (max d’affilée)',unit:'reps',ph:'ex. 15'},
  dips:{sport:'sw',kind:'reps',label:'Dips stricts (max d’affilée)',unit:'reps',ph:'ex. 25'},
  pushups:{sport:'sw',kind:'reps',label:'Pompes strictes (max d’affilée)',unit:'reps',ph:'ex. 50'},
  muscleup:{sport:'sw',kind:'reps',label:'Muscle-ups stricts enchaînés',unit:'reps',ph:'ex. 3'},
  frontlever:{sport:'sw',kind:'stage',label:'Front lever : stade tenu 5 s',stages:FL_STAGES},
  planche:{sport:'sw',kind:'stage',label:'Planche : stade tenu 5 s',stages:PL_STAGES},
  handstand:{sport:'sw',kind:'sec',label:'Équilibre libre (handstand) tenu',unit:'s',ph:'ex. 20'},
  lsit:{sport:'sw',kind:'sec',label:'L-sit tenu',unit:'s',ph:'ex. 20'},
  jump:{sport:'volley',kind:'cm',label:'Détente verticale (saut sans élan)',unit:'cm',taper:1,ph:'ex. 60'},
  volleyPeak:{sport:'volley',kind:'event',label:'Être au top pour une compétition de volley',taper:1},
  weight:{sport:'general',kind:'kg',label:'Poids de corps cible',unit:'kg',ph:'ex. 75'}
};
function finishDef(d){
  return {taper:d>=30?2:1, peak:d<=5?15:d<=10?22:d<=22?32:48, long:d<=10?Math.min(d,10):d<=22?Math.round(d*0.85):30, minW:d<=5?4:d<=10?6:d<=22?10:16, dist:d};
}
function goalDef(g){const b=GOALS[g.type];if(!b)return null;if(b.kind==='finish'){const d=num(g.cible)||10;return Object.assign({},b,finishDef(d));}return b;}
function goalTargetLabel(g){
  const d=GOALS[g.type];if(!d)return '';
  if(d.kind==='time'){const s=parseTime(g.cible);return s?fmtTime(s):g.cible;}
  if(d.kind==='stage')return d.stages[+g.cible]||'';
  if(d.kind==='event')return 'Compétition';
  return fr(num(g.cible))+' '+(d.unit||'');
}
const RATES={
  pullups:x=>Math.max(0.12,0.5-0.02*x),
  dips:x=>Math.max(0.25,0.9-0.025*x),
  pushups:x=>Math.max(0.4,1.8-0.035*x),
  handstand:x=>Math.max(0.4,1.2-0.015*x),
  lsit:x=>Math.max(0.5,2-0.05*x)
};
function weeksTo(cur,target,fn,mult=1){let x=cur,w=0;while(x<target&&w<1040){x+=fn(x)*mult;w++;}return w;}
function valueAfter(cur,weeks,fn,mult=1){let x=cur;for(let i=0;i<weeks;i++)x+=fn(x)*mult;return x;}
const FL_WEEKS=[8,10,12,16,20];
const PL_WEEKS=[6,10,16,26,40];

/* ==========================================================================
   3. MÉTRIQUES ACTUELLES (questionnaire + derniers tests)
   ========================================================================== */
const REF_AGE={'1':1,'3':1.01,'6':1.03,'12':1.05};
function currentMetrics(p,logs){
  const c={pullups:num(p.tractions)||0,dips:num(p.dips)||0,pushups:num(p.pompes)||0,muscleup:num(p.muscleup)||0,
    frontlever:+p.fl||0,planche:+p.planche||0,handstand:num(p.handstand)||0,handstandWall:num(p.handstandMur)||0,lsit:num(p.lsit)||0,
    jump:num(p.vDetente),weight:num(p.poids),runRef:null};
  const rs=parseTime(p.refTemps),rd=num(p.refDist);
  if(rs&&rd)c.runRef={dist:rd,sec:rs*(REF_AGE[p.refAge]||1)};
  if(parseTime(p.ref10))c.runRef={dist:10,sec:parseTime(p.ref10)*(REF_AGE[p.refAge]||1)};
  if(parseTime(p.ref5))c.runRef={dist:5,sec:parseTime(p.ref5)*(REF_AGE[p.refAge]||1)};
  const since=p.savedAt?p.savedAt.slice(0,10):'0000';
  const sorted=(logs||[]).filter(l=>l.date>=since&&l.statut!=='annulee').sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  for(const l of sorted){
    const t=l.tests||{};
    for(const k of ['pullups','dips','pushups','muscleup','frontlever','planche','handstand','lsit','jump'])if(t[k]!=null&&t[k]!=='')c[k]=+t[k];
    if(t.run&&t.run.sec&&t.run.dist)c.runRef={dist:+t.run.dist,sec:+t.run.sec};
    if(l.poids)c.weight=+l.poids;
  }
  const pz=nutriPesees().filter(x=>x.date>=since);
  if(pz.length){const last=pz[pz.length-1];const lastLog=sorted.filter(l=>l.poids).pop();if(!lastLog||last.date>=lastLog.date)c.weight=last.kg;}
  return c;
}

/* ==========================================================================
   4. ANALYSE DE FAISABILITÉ
   ========================================================================== */
function runLevelFromT10(t10){return t10>3600?0:t10>2700?1:t10>2280?2:3;}
const RUN_RATE=[0.008,0.0045,0.0025,0.0012];
const RUN_LEVEL_LABEL=['débutant','intermédiaire','confirmé','avancé'];
const EF_DEFAULT=[435,375,340,305];

/* Compare ta progression mesurée (questionnaire + tests, sur au moins 4 semaines) à la progression moyenne du modèle.
   Retourne un facteur : 1 = comme la moyenne, 1,5 = 50 % plus vite. */
function personalFactor(g,p,logs,start,A){
  if(!logs||!logs.length)return null;
  const pts=goalSeries(g,p,logs,{start}).filter(x=>x.src!=='Pesée'&&x.src!=='Pesée (séance)');
  if(pts.length<2)return null;
  const a=pts[0],b=pts[pts.length-1];const weeks=(b.x-a.x)/604800000;
  if(weeks<4)return null;
  const k=g.def.kind;let f=null;
  if(k==='time'){const lvl=A.runLevel;const r=1-Math.pow(b.y/a.y,1/weeks);f=r/RUN_RATE[lvl];}
  else if((k==='reps'||k==='sec')&&RATES[g.type]){const model=valueAfter(a.y,Math.round(weeks),RATES[g.type])-a.y;if(model<0.3)return null;f=(b.y-a.y)/model;}
  else if(k==='cm'){const G={loisir:12,departemental:10,regional:7,national:5}[p.vNiveau]||10;const model=G*(1-Math.exp(-weeks/16));f=(b.y-a.y)/model;}
  else return null;
  if(!isFinite(f))return null;
  return {factor:clamp(f,0.3,2.5),weeks:Math.round(weeks),n:pts.length};
}
function analyze(p,cur,logs){
  const t0=today();
  const start=parseDate(p.debut)||t0;
  const from=start>t0?start:t0;
  const A={warnings:[],goals:[],start,vma:null,t10:null,runLevel:0};
  const ref=cur.runRef;
  if(ref){A.t10=riegel(ref.sec,ref.dist,10);A.vma=(10/(A.t10/3600))/0.89;A.runLevel=runLevelFromT10(A.t10);}
  else{const km=num(p.kmSemaine)||0;A.runLevel=km>=35?2:km>=12?1:0;}
  A.efPace=A.vma?3600/(A.vma*0.68):EF_DEFAULT[A.runLevel];

  const poids=num(p.poids),taille=num(p.taille);
  const bmi=poids&&taille?poids/Math.pow(taille/100,2):null;
  const pullMult=bmi&&bmi>27?0.75:1;

  for(const g0 of (p.objectifs||[])){
    const def=goalDef(g0);if(!def)continue;
    const g=Object.assign({},g0,{def,dateObj:parseDate(g0.date)});
    const avail=g.dateObj?daysBetween(from,g.dateObj)/7:0;
    const F={verdict:'info',need:null,avail:Math.max(0,avail),msg:'',realTarget:null,realDate:null,initial:null,target:null};
    g.feas=F;
    A.goals.push(g);
    if(!g.dateObj){F.verdict='info';F.msg='Date manquante.';continue;}
    if(avail<0){F.verdict='past';F.msg='La date de cet objectif est passée : mets-la à jour.';continue;}
    const taper=def.taper||0;
    const pf=personalFactor(g,p,logs,start,A);F.personal=pf;const pfm=pf?pf.factor:1;
    const pfTxt=pf?` Calcul basé sur ta progression réelle mesurée sur ${pf.weeks} semaines (${pf.n} mesures) : ${pf.factor>=1?fr(pf.factor,1)+' fois plus rapide':fr(1/pf.factor,1)+' fois plus lente'} que la moyenne.${pf.factor<0.6?' Une progression aussi lente signale souvent un manque de récupération (sommeil, nutrition) ou d’assiduité.':''}`:'';
    const finish=(need,realTargetTxt,extra)=>{
      F.need=Math.ceil(need);
      if(F.need<=0){F.verdict='done';}
      else if(avail>=F.need)F.verdict='ok';
      else if(avail>=F.need*0.8)F.verdict='hard';
      else F.verdict='no';
      F.realDate=addDays(from,Math.ceil(need)*7);
      F.realTarget=realTargetTxt;
      if(extra)F.msg+=extra;
      if(pfTxt)F.msg+=pfTxt;
    };

    if(def.kind==='time'||def.kind==='finish'||def.kind==='volume'){
      const km=num(p.kmSemaine)||0, longCur=num(p.sortieLongue)||0;
      const startV=Math.max(km,8);
      if(def.kind==='volume'){
        const target=num(g.cible)||0;F.initial=km;F.target=target;
        const need=startV>=target?0:Math.log(target/startV)/Math.log(1.075);
        const weeklyMin=target*A.efPace/60, availMin=(num(p.seancesMax)||0)*(num(p.dureeMax)||60);
        F.msg=`Tu cours ${fr(km)} km/sem. Pour monter à ${fr(target)} km sans te blesser, on augmente d’environ 7 à 8 % par semaine avec une semaine allégée toutes les 4 semaines.`;
        finish(need, fr(Math.round(Math.min(target,startV*Math.pow(1.075,Math.max(0,avail)))))+' km/sem.');
        if(weeklyMin>availMin*0.7){F.verdict='no';F.msg+=` Problème de temps : ${fr(target)} km représentent environ ${Math.round(weeklyMin/60*10)/10} h de course par semaine, trop pour ton emploi du temps déclaré.`;}
        continue;
      }
      const d=def.dist;
      const volW=startV>=def.peak?0:Math.log(def.peak/startV)/Math.log(1.075);
      const longW=Math.max(0,(def.long-longCur)/1.5);
      if(def.kind==='finish'){
        F.initial=longCur;F.target=d;
        const need=Math.max(volW,longW,def.minW-taper)+taper;
        F.msg=`Pour finir ${fr(d)} km en sécurité, il faut un volume d’environ ${def.peak} km/sem. et une sortie longue de ${def.long} km. Tu es à ${fr(km)} km/sem. et ${fr(longCur)} km en sortie longue.`;
        finish(need,null);
        if(d>=42&&(num(p.dureeWE)||120)<180)F.msg+=' Attention : les sorties longues d’un marathon durent 2 h 30 à 3 h 15, plus que ta durée maximale du week-end.';
        continue;
      }
      const target=parseTime(g.cible);
      if(!target){F.verdict='info';F.msg='Temps cible illisible : utilise le format mm:ss ou h:mm:ss.';continue;}
      F.target=target;
      const pace=target/d;
      if(pace<150){F.verdict='no';F.msg=`Ce temps correspond à ${fmtPace(pace)}, au-delà des records du monde. Vérifie le format (h:mm:ss).`;continue;}
      if(!ref){
        const need=Math.max(volW,longW,def.minW-taper)+taper;
        F.need=Math.ceil(need);F.realDate=addDays(from,F.need*7);
        F.verdict='info';
        F.msg=`Sans chrono de référence récent, je ne peux pas juger le temps visé. Côté volume, il te faut au moins ${F.need} semaines (tu en as ${Math.floor(avail)}). Un test chrono est prévu (semaine 1, ou semaine 4 si tu débutes) : renseigne-le et l’analyse se mettra à jour.`;
        if(avail<F.need)F.verdict='no';
        continue;
      }
      const equiv=riegel(ref.sec,ref.dist,d);F.initial=equiv;
      const rate=Math.min(0.02,RUN_RATE[A.runLevel]*pfm);
      const perfW=target>=equiv?0:Math.log(equiv/target)/(-Math.log(1-rate));
      const need=Math.max(perfW+taper,volW+taper,longW+taper,def.minW);
      const gain=(equiv-target)/equiv*100;
      const realT=equiv*Math.pow(1-rate,Math.max(0,avail-taper));
      F.msg=`Ton niveau actuel équivaut à ${fmtTime(equiv)} sur cette distance (allure ${fmtPace(equiv/d)}). L’objectif demande ${gain>0?'de gagner '+fr(gain)+' %':'de maintenir ton niveau'} (allure cible ${fmtPace(pace)}). Progression réaliste pour un coureur ${RUN_LEVEL_LABEL[A.runLevel]} : environ ${fr(rate*100,2)} % par semaine d’entraînement bien conduit.`;
      if(volW+taper>perfW+taper&&volW>0)F.msg+=` Le facteur limitant est ton volume : il faut monter progressivement à ${def.peak} km/sem.`;
      finish(need,fmtTime(Math.max(realT,target)));
      if(d>=42&&(num(p.dureeWE)||120)<180)F.msg+=' Attention : les sorties longues d’un marathon durent 2 h 30 à 3 h 15, plus que ta durée maximale du week-end.';
      continue;
    }

    if(def.kind==='reps'||def.kind==='sec'){
      const key=g.type, curV=cur[key]||0, target=num(g.cible)||0;F.initial=curV;F.target=target;
      if(key==='muscleup'){
        const needPull=weeksTo(cur.pullups,12,RATES.pullups,pullMult), needDip=weeksTo(cur.dips,15,RATES.dips);
        let need;
        if(curV>=1)need=Math.max(0,target-curV)*3;
        else need=Math.max(needPull,needDip)+6+Math.max(0,target-1)*3;
        F.msg=curV>=1?`Tu fais déjà ${curV} muscle-up(s). Compte environ 3 semaines par répétition supplémentaire.`
          :`Prérequis d’un muscle-up strict : au moins 12 tractions strictes et 15 dips. Tu es à ${cur.pullups} tractions et ${cur.dips} dips, puis il faut 4 à 8 semaines de travail technique (tirage explosif et transition).`;
        const realW=Math.max(0,avail);
        let realTxt;
        if(curV>=1)realTxt=Math.min(target,curV+Math.floor(realW/3))+' rep(s)';
        else realTxt=realW>=Math.max(needPull,needDip)+6?Math.min(target,1+Math.floor((realW-Math.max(needPull,needDip)-6)/3))+' rep(s)':'prérequis en cours';
        finish(need,realTxt);continue;
      }
      if(key==='handstand'&&cur.handstandWall<30){
        const need=weeksTo(curV,target,RATES.handstand)+4;
        F.msg=`Tu tiens ${cur.handstandWall} s au mur. Il faut d’abord 30 s solides au mur (4 semaines environ), puis le libre progresse d’environ 1 s par semaine au début, avec une pratique quotidienne de 10 minutes.`;
        finish(need,Math.round(Math.min(target,valueAfter(curV,Math.max(0,avail-4),RATES.handstand)))+' s');continue;
      }
      const fn=RATES[key];
      const mult=(key==='pullups'?pullMult:1)*pfm;
      const need=weeksTo(curV,target,fn,mult);
      const realV=Math.floor(valueAfter(curV,Math.max(0,Math.floor(avail)),fn,mult));
      const unitTxt=def.unit==='s'?' s':' reps';
      F.msg=`Tu es à ${curV}${unitTxt}. Plus tu es fort, plus chaque répétition gagnée coûte cher : la progression ralentit avec le niveau.`+(mult<1?' Ton poids de corps rend la progression en tirage un peu plus lente.':'');
      finish(need,Math.min(target,realV)+unitTxt);continue;
    }

    if(def.kind==='stage'){
      const key=g.type,curS=cur[key]||0,target=+g.cible||0;F.initial=curS;F.target=target;
      const W=key==='frontlever'?FL_WEEKS:PL_WEEKS;
      let need=0;for(let s=curS;s<target;s++)need+=W[s];
      let pre=0,preTxt='';
      if(key==='frontlever'&&curS<1&&cur.pullups<8){pre=weeksTo(cur.pullups,8,RATES.pullups,pullMult);preTxt=` Prérequis : 8 tractions strictes (tu en fais ${cur.pullups}).`;}
      if(key==='planche'&&curS<2&&(cur.dips<15||cur.pushups<30)){pre=Math.max(weeksTo(cur.dips,15,RATES.dips),weeksTo(cur.pushups,30,RATES.pushups));preTxt=` Prérequis : 15 dips et 30 pompes (tu es à ${cur.dips} et ${cur.pushups}).`;}
      need+=pre;
      let s=curS,left=Math.max(0,avail)-pre;while(s<target&&left>=W[s]){left-=W[s];s++;}
      F.msg=`Stade actuel : ${def.stages[curS]}. Durées moyennes constatées avec 2 à 3 séances spécifiques par semaine, très variables selon le gabarit (les grands gabarits progressent plus lentement).`+preTxt;
      finish(need,def.stages[s]);continue;
    }

    if(def.kind==='cm'){
      const target=num(g.cible)||0;F.target=target;
      if(cur.jump==null){F.verdict='info';F.msg='Je n’ai pas ta détente actuelle : un test est prévu en semaine 1. L’analyse se mettra à jour dès que tu l’auras saisi.';continue;}
      F.initial=cur.jump;
      const Gmax=({loisir:12,departemental:10,regional:7,national:5}[p.vNiveau]||10)*clamp(pfm,0.5,1.5), tau=16;
      const gneed=target-cur.jump;
      const realGain=Gmax*(1-Math.exp(-Math.max(0,avail-1)/tau));
      if(gneed<=0){finish(0,null);continue;}
      if(gneed>=Gmax*0.97){F.verdict='no';F.need=null;F.realTarget=fr(cur.jump+realGain)+' cm';F.msg=`Gagner ${gneed} cm dépasse ce qu’un cycle de pliométrie et de force apporte à ton niveau (ordre de grandeur : ${Gmax} cm au maximum sur un an, en général 4 à 8 cm sur 8 à 12 semaines). Cible réaliste à la date : ${fr(cur.jump+realGain)} cm.`;continue;}
      const need=-tau*Math.log(1-gneed/Gmax)+1;
      F.msg=`Tu es à ${cur.jump} cm. Les programmes de pliométrie et de force bien conduits apportent en général 4 à 8 cm en 8 à 12 semaines, avec des gains qui ralentissent ensuite.`;
      finish(need,fr(cur.jump+realGain)+' cm');continue;
    }

    if(def.kind==='kg'){
      const target=num(g.cible)||0,w=cur.weight||poids||0;F.initial=w;F.target=target;
      if(!w){F.verdict='info';F.msg='Renseigne ton poids actuel.';continue;}
      const delta=target-w;
      if(taille&&target/Math.pow(taille/100,2)<18.5){F.verdict='no';F.msg=`Cette cible donne un IMC inférieur à 18,5 : je ne la valide pas, elle nuirait à ta santé et à tes performances.`;continue;}
      let need,realTxt;
      if(delta<0){need=Math.abs(delta)/(0.0075*w);realTxt=fr(Math.max(target,w-0.0075*w*Math.max(0,avail)))+' kg';F.msg=`Perte visée : ${fr(-delta)} kg. Rythme sain : 0,5 à 1 % du poids par semaine (environ ${fr(0.0075*w)} kg/sem.) pour préserver le muscle et la performance.`;}
      else{need=delta/(0.0025*w);realTxt=fr(Math.min(target,w+0.0025*w*Math.max(0,avail)))+' kg';F.msg=`Prise visée : ${fr(delta)} kg. Prise de muscle réaliste : environ 0,25 % du poids par semaine, au-delà c’est surtout du gras.`;}
      finish(need,realTxt);continue;
    }
    if(def.kind==='event'){F.verdict='info';F.msg='Le programme intensifie le travail spécifique puis allège la semaine précédente pour que tu sois frais le jour J.';}
  }

  /* Quotas de séances */
  const runGoals=A.goals.filter(g=>g.def.sport==='course'&&g.feas.verdict!=='past');
  const swGoals=A.goals.filter(g=>g.def.sport==='sw'&&g.feas.verdict!=='past');
  const vGoals=A.goals.filter(g=>g.def.sport==='volley'&&g.feas.verdict!=='past');
  const prio=sp=>{const gs=A.goals.filter(g=>g.def.sport===sp&&g.feas.verdict!=='past');if(gs.some(g=>g.priorite==='principal'))return 2;return gs.length?1:0;};
  A.runGoals=runGoals;A.swGoals=swGoals;A.vGoals=vGoals;
  const raceGoal=runGoals.filter(g=>g.def.kind==='time'||g.def.kind==='finish').sort((a,b)=>(b.priorite==='principal')-(a.priorite==='principal')||a.dateObj-b.dateObj)[0]||null;
  A.raceGoal=raceGoal;
  let R=2;
  if(raceGoal){const d=raceGoal.def.dist;R=d>=40?4:d>=20?((num(p.seancesMax)||0)>=7&&A.runLevel>=1?4:3):3;}
  const vol=runGoals.find(g=>g.def.kind==='volume');
  if(vol)R=Math.max(R,clamp(Math.ceil((num(vol.cible)||0)/12),3,5));
  let S=swGoals.length?3:2;
  let P=vGoals.some(g=>g.type==='jump')?2:(vGoals.length?1:0);
  const club=(p.vClubJours||[]).length, matches=(p.vMatchJours||[]).length;
  const days=new Set([...(p.jours||[]),...(p.vClubJours||[]),...(p.vMatchJours||[])]);
  const cap=Math.min(num(p.seancesMax)||days.size, days.size*(p.doubles?2:1));
  A.desired={R,S,P};
  const mins={R:prio('course')===2?2:1,S:prio('sw')===2?2:1,P:prio('volley')===2&&vGoals.some(g=>g.type==='jump')?1:0};
  const order=['R','S','P'].map(k=>({k,pr:prio({R:'course',S:'sw',P:'volley'}[k])})).sort((a,b)=>a.pr-b.pr);
  const q={R,S,P};
  let guard=0;
  const tie={P:0,S:1,R:2};
  while(q.R+q.S+q.P+club+matches>cap&&guard++<20){
    const cand=order.filter(o=>q[o.k]>mins[o.k]).sort((a,b)=>a.pr-b.pr||q[b.k]-q[a.k]||tie[a.k]-tie[b.k]);
    if(!cand.length)break;
    q[cand[0].k]--;
  }
  A.quota=q;A.club=club;A.matches=matches;A.cap=cap;A.days=days;
  const total=q.R+q.S+q.P+club+matches;
  if(q.R<R||q.S<S||q.P<P){
    A.warnings.push({lvl:'warn',txt:`Ton emploi du temps ne permet pas tout : il faudrait ${R+S+P+club+matches} séances par semaine pour viser tous tes objectifs, tu en as ${cap} au maximum. J’ai gardé en priorité le sport de ton objectif principal (course : ${q.R}, street workout : ${q.S}, pliométrie volley : ${q.P}). Les objectifs secondaires progresseront plus lentement que prévu.`});
  }
  if(total>cap)A.warnings.push({lvl:'bad',txt:`Même au minimum, ${total} séances sont nécessaires pour ${cap} créneaux. Ajoute des jours disponibles ou accepte les doubles séances, sinon certaines séances ne seront pas placées.`});
  if(days.size===0)A.warnings.push({lvl:'bad',txt:'Aucun jour disponible : coche tes jours d’entraînement.'});

  /* Signaux santé & récupération */
  const sleep=num(p.sommeil);
  if(sleep!=null&&sleep<7)A.warnings.push({lvl:'warn',txt:`Tu dors ${fr(sleep)} h par nuit. En dessous de 7 h, la récupération et le risque de blessure se dégradent nettement. C’est le levier de progression le moins cher que tu aies.`});
  if((+p.stress||0)>=4)A.warnings.push({lvl:'warn',txt:'Stress élevé déclaré : la charge totale (travail + sport) compte. Si ta forme baisse plusieurs jours de suite, remplace une séance difficile par une séance facile.'});
  if((+p.douleur||0)>=4)A.warnings.push({lvl:'bad',txt:`Douleur actuelle de ${p.douleur}/10 : consulte un médecin du sport ou un kinésithérapeute avant d’appliquer les séances intenses. Une douleur qui modifie ta gestuelle n’est jamais « à travailler à travers ».`});
  if(p.medical==='oui-sans')A.warnings.push({lvl:'bad',txt:'Tu as un suivi ou une contre-indication médicale sans avis favorable : obtiens le feu vert de ton médecin avant de commencer.'});
  const inj=p.blessures||[];
  if(inj.some(z=>['genou','cheville','achille','mollet'].includes(z))&&(vGoals.length||raceGoal))A.warnings.push({lvl:'warn',txt:'Antécédent au genou, à la cheville, au mollet ou au tendon d’Achille : course et sauts sollicitent les mêmes structures. Les sauts en contrebas (drop jumps) sont retirés du programme et le renforcement excentrique des mollets est systématique.'});
  if(inj.includes('epaule'))A.warnings.push({lvl:'warn',txt:'Antécédent à l’épaule : volley (attaque, service) et street workout chargent l’épaule. Le travail des rotateurs externes est intégré à chaque séance de poussée ; arrête toute amplitude douloureuse.'});
  const heavyRun=raceGoal&&raceGoal.def.dist>=21;
  const heavySkill=swGoals.some(g=>['planche','frontlever','muscleup'].includes(g.type)&&g.priorite==='principal');
  if(heavyRun&&heavySkill)A.warnings.push({lvl:'warn',txt:'Préparer un semi ou un marathon en même temps qu’un objectif de force maximale (planche, front lever, muscle-up) crée un effet d’interférence : le gros volume de course freine les gains de force. C’est faisable, mais l’un des deux progressera moins vite.'});
  if(raceGoal&&raceGoal.def.long){
    const longMin=raceGoal.def.long*A.efPace/60;
    if(longMin>(num(p.dureeWE)||num(p.dureeMax)||60)+5)A.warnings.push({lvl:'warn',txt:`Ta plus longue sortie montera vers ${raceGoal.def.long} km, soit environ ${Math.round(longMin)} min. C’est plus que ta durée maximale le week-end : garde un créneau plus long ce jour-là.`});
  }
  if(templateMode(p)){
    A.warnings=A.warnings.filter(w=>!/emploi du temps|Même au minimum|Aucun jour disponible/.test(w.txt));
    const skills=A.goals.filter(g=>['frontlever','planche','handstand','lsit','muscleup'].includes(g.type)&&g.feas.verdict!=='past');
    if(skills.length)A.warnings.push({lvl:'warn',txt:`Ta semaine type ne contient pas de travail spécifique pour : ${skills.map(g=>g.def.label.replace('…','').toLowerCase()).join(', ')}. Ces objectifs progresseront peu. Dis-le-moi si tu veux un bloc dédié dans la séance poids du corps.`});
    if(A.goals.some(g=>g.type==='jump'&&g.feas.verdict!=='past'))A.warnings.push({lvl:'warn',txt:'Ta semaine type n’a pas de séance de sauts : seuls le Front Squat et le Soulevé de Terre Roumain travaillent ta détente. L’objectif de détente sera plus lent que l’estimation.'});
  }
  return A;
}

/* ==========================================================================
   5. GÉNÉRATION DU PROGRAMME
   ========================================================================== */
function goalWeek(start,d){return Math.floor(daysBetween(start,mondayOf(d))/7)+1;}
function phaseFor(goals,i,start){
  const fut=goals.filter(g=>g.dateObj&&goalWeek(start,g.dateObj)>=i).sort((a,b)=>a.dateObj-b.dateObj);
  const past=goals.filter(g=>g.dateObj&&goalWeek(start,g.dateObj)<i).sort((a,b)=>b.dateObj-a.dateObj);
  const prevW=past.length?goalWeek(start,past[0].dateObj):0;
  if(past.length&&i===prevW+1&&(past[0].def.taper||0)>=1)return {phase:'Récupération',goal:past[0],k:3};
  if(!fut.length)return {phase:'Entretien',goal:null,k:(i-1)%4};
  const g=fut[0],gw=goalWeek(start,g.dateObj),taper=g.def.taper||1;
  const blockStart=prevW+(past.length&&(past[0].def.taper||0)>=1?2:1);
  const toGoal=gw-i;
  if(toGoal<taper)return {phase:'Affûtage',goal:g,k:0,toGoal};
  const len=Math.max(1,gw-taper-blockStart+1),pos=i-blockStart,f=pos/len;
  return {phase:f<0.4?'Fondation':f<0.8?'Développement':'Spécifique',goal:g,k:Math.max(0,pos)%4,toGoal};
}
const PCT={Fondation:[.55,.6,.65],Développement:[.6,.65,.7],Spécifique:[.7,.75,.8],Affûtage:[.6,.6,.6],Entretien:[.55,.6,.6],Récupération:[.5,.5,.5]};

const DEFAULT_WEEK={days:[[{t:'push'},{t:'ef',km:6}],[{t:'ef',km:6},{t:'volley'}],[{t:'pull'}],[{t:'long',km:10}],[],[{t:'pdc'}],[{t:'frac',km:8}]],volMax:40};
function weekTemplate(p){const s=p&&p.semaine;return s&&Array.isArray(s.days)&&s.days.length===7?s:DEFAULT_WEEK;}
function templateMode(p){return !!p&&p.mode!=='auto';}
function bandsFor(kg){let best=null;for(let m=1;m<(1<<SW_PACK.length);m++){let s=0,c=0;const idx=[];for(let i=0;i<SW_PACK.length;i++)if(m&(1<<i)){s+=SW_PACK[i];c++;idx.push(i);}const d=Math.abs(s-kg);if(!best||d<best.d||(d===best.d&&c<best.c))best={d,c,idx,s};}return best;}
const bandsSum=idx=>(idx||[]).reduce((a,i)=>a+SW_PACK[i],0);
function bandsLabel(idx){const v=(idx||[]).map(i=>SW_PACK[i]).sort((a,b)=>a-b);return v.length?v.join(' + ')+(v.length>1?' = '+bandsSum(idx)+' kg':' kg'):'aucun';}

/* --- Progression des exercices à élastiques : fourchette de répétitions + résistance --- */
function swState(ex,logs,before){
  let res=ex.start,fails=0,why=`Point de départ indicatif (${ex.start} kg) : ajuste pour finir chaque série avec 2 répétitions en réserve.`;
  const L=logs.filter(l=>l.statut!=='annulee'&&l.date<before&&(l.sets||[]).some(s=>s.nom===ex.nom)).sort((a,b)=>a.date<b.date?-1:1);
  for(const l of L){
    const s=l.sets.find(x=>x.nom===ex.nom);const vals=s.vals.filter(v=>v!=null);const used=s.res!=null?+s.res:res;const full=vals.length>0&&vals.length===s.vals.length;const dt=fmtDate(parseDate(l.date));
    if(full&&vals.every(v=>v>=ex.hi)){res=Math.min(ex.cap||120,used+5);fails=0;why=`+5 kg : toutes tes séries ont atteint ${ex.hi} répétitions le ${dt} (avec ${used} kg). Repars à ${ex.lo} répétitions.`;}
    else if(full&&vals.every(v=>v>=ex.lo)){res=used;fails=0;why=`Même résistance (${used} kg) : vise ${ex.hi} répétitions sur toutes les séries avant de monter (dernière séance le ${dt}).`;}
    else{fails++;if(fails>=2){res=Math.max(5,used-5);fails=0;why=`−5 kg : deux séances de suite sous ${ex.lo} répétitions (dernière le ${dt}).`;}else{res=used;why=`Même résistance (${used} kg) : la séance du ${dt} n’a pas atteint ${ex.lo} répétitions sur toutes les séries. On ne monte pas tant que ce n’est pas réussi.`;}}
  }
  return {res,why:why.replace(/\.\./g,'.')};
}
/* --- Progression poids du corps : objectif de répétitions par série --- */
function bwState(ex,logs,before){
  let r=ex.init,fails=0,why=`Point de départ : environ 60 % de ton maximum.`;
  const L=logs.filter(l=>l.statut!=='annulee'&&l.date<before&&(l.sets||[]).some(s=>s.nom===ex.nom)).sort((a,b)=>a.date<b.date?-1:1);
  for(const l of L){
    const s=l.sets.find(x=>x.nom===ex.nom);const vals=s.vals.filter(v=>v!=null);const used=s.cible!=null?+s.cible:r;const full=vals.length>0&&vals.length===s.vals.length;const dt=fmtDate(parseDate(l.date));
    if(full&&vals.every(v=>v>=used)){r=used+1;fails=0;why=`+1 répétition : toutes les séries réussies à ${used} le ${dt}.`;}
    else{fails++;if(fails>=2){r=Math.max(1,used-1);fails=0;why=`−1 répétition : deux séances de suite incomplètes (dernière le ${dt}).`;}else{r=used;why=`Même objectif (${used}) : toutes les séries n’ont pas été réussies le ${dt}. On ne monte pas tant que ce n’est pas fait.`;}}
  }
  return {r,why:why.replace(/\.\./g,'.')};
}

/* --- Forme en course : allure 5 km recalculée à partir de tes séances --- */
function initialP5(p){
  const age=REF_AGE[p.refAge]||1,est=[],src=[];
  const t5=parseTime(p.ref5),t10=parseTime(p.ref10);
  if(t5){est.push(t5*age/5);src.push('ton chrono sur 5 km ('+fmtTime(t5)+')');}
  if(t10){est.push(riegel(t10*age,10,5)/5);src.push('ton chrono sur 10 km ('+fmtTime(t10)+')');}
  if(!est.length&&num(p.refDist)&&parseTime(p.refTemps)){est.push(riegel(parseTime(p.refTemps)*age,num(p.refDist),5)/5);src.push('ton chrono de référence');}
  if(est.length)return {p5:est.reduce((a,b)=>a+b,0)/est.length,src:src.join(' et ')};
  const base=parseTime(p.allureBase);if(base)return {p5:base/1.22,src:'ton allure habituelle en footing ('+fmtTime(base)+' /km)'};
  return {p5:420,src:'une valeur par défaut (renseigne un chrono dans le questionnaire)'};
}
function runFitness(p,logs,before){
  const ini=initialP5(p);const fk=num((weekTemplate(p).days.flat().find(x=>x.t==='frac')||{}).km)||8;let p5=ini.p5,why=`Calculées à partir de ${ini.src}.`,repsN=clamp(Math.round((fk-3.3)/1.2),3,8),repDist=0.8,miss=0;
  const L=logs.filter(l=>l.sport==='course'&&l.statut!=='annulee'&&l.date<before).sort((a,b)=>a.date<b.date?-1:1);
  for(const l of L){
    const t=l.tests&&l.tests.run,dt=fmtDate(parseDate(l.date));
    if(t&&t.sec&&t.dist){p5=(t.dist===5?t.sec:riegel(t.sec,t.dist,5))/5;why=`Recalculées avec ton chrono de ${fr(t.dist)} km du ${dt} (${fmtTime(t.sec)}).`;continue;}
    const pl=l.plan||{};if(pl.kind!=='run-frac'||!pl.repsN)continue;
    const reps=((l.run&&l.run.reps)||[]).filter(x=>x>0),d=pl.repDist||0.8,before5=p5;
    if(reps.length>=pl.repsN){
      const a=reps.reduce((s,x)=>s+x,0)/reps.length/d,rpe=num(l.rpe);
      if(a<=p5*0.98&&(rpe==null||rpe<=8)){const np=Math.max(p5*0.98,a);why=`Accélérées : ton fractionné du ${dt} était plus rapide que prévu (moyenne ${fmtPace(a)}).`;p5=np;}
      else if(a<=p5*1.01){if(rpe!=null&&rpe<=7){p5*=0.99;why=`Accélérées de 1 % : fractionné du ${dt} tenu avec de la marge (effort ${rpe}/10).`;}else why=`Inchangées : fractionné du ${dt} tenu à l’allure prévue.`;}
      else if(a>p5*1.03){p5=Math.min(p5*1.03,a);why=`Ralenties : ton fractionné du ${dt} était plus lent que prévu (moyenne ${fmtPace(a)}).`;}
      else why=`Inchangées : fractionné du ${dt} juste un peu plus lent que prévu.`;
      if(a<=before5*1.02){repsN++;if(repDist<1&&repsN>8){repDist=1;repsN=5;}else if(repDist>=1&&repsN>7)repsN=7;}
      miss=0;
    }else{
      miss++;why=`Inchangées : ${reps.length} répétition${reps.length>1?'s':''} sur ${pl.repsN} le ${dt}.`;
      if(miss>=2){p5*=1.02;repsN=Math.max(4,repsN-1);miss=0;why=`Ralenties de 2 % et une répétition en moins : deux fractionnés incomplets de suite.`;}
    }
  }
  return {p5,why:why.replace(/\.\./g,'.'),repsN,repDist};
}

function buildTemplateWeeks(p,logs,A,start,nW){
  const tpl=weekTemplate(p),ts=toStr(today());
  const runDefs=[];tpl.days.forEach((list,d)=>list.forEach(s=>{if(TPL_KM[s.t]!=null)runDefs.push({d,t:s.t,km:num(s.km)||TPL_KM[s.t]});}));
  const baseSum=runDefs.reduce((a,r)=>a+r.km,0)||0;
  const Vmax=Math.max(baseSum,num(tpl.volMax)||40),Vmin=Math.round(baseSum*0.6);
  const cur=num(p.kmSemaine);
  let V=baseSum;if(cur!=null&&cur>0&&cur<baseSum*0.8)V=Math.round(Math.max(baseSum*0.7,cur*1.1));
  let reason=`Semaine 1 : ${V} km${V<baseSum?` (tu cours ${cur} km par semaine en ce moment : on démarre un peu en dessous de ta semaine type)`:''}.`;
  const raceGoals=A.goals.filter(g=>g.def.sport==='course'&&(g.def.kind==='time'||g.def.kind==='finish')&&g.dateObj&&g.feas.verdict!=='past');
  const weeks=[];
  for(let i=1;i<=nW;i++){
    const ws=addDays(start,(i-1)*7),we=addDays(ws,6),wsS=toStr(ws),weS=toStr(we),past=weS<ts;
    const deload=i%4===0;
    const race=raceGoals.find(g=>g.dateObj>=ws&&g.dateObj<=we);
    const Vi=Math.round(V*(deload?0.8:1)*(race?0.7:1));
    const fit=runFitness(p,logs,wsS<=ts?wsS:ts);
    const sessions=[];
    // course : fractionné d'abord (son volume dépend des répétitions), puis répartition du reste
    const fracDef=runDefs.find(r=>r.t==='frac');
    let fracKm=0;
    const runMade={};
    if(fracDef){const s=tplRun('frac',0,fit,p,deload);fracKm=s.plannedKm;runMade[runDefs.indexOf(fracDef)]=s;}
    const others=runDefs.filter(r=>r.t!=='frac'),oSum=others.reduce((a,r)=>a+r.km,0)||1,rest=Math.max(0,Vi-fracKm);
    for(const r of others){let km=Math.max(3,Math.round(rest*r.km/oSum*2)/2);if(r.t==='long')km=Math.min(km,21);runMade[runDefs.indexOf(r)]=tplRun(r.t,km,fit,p,deload);}
    tpl.days.forEach((list,d)=>{const date=toStr(addDays(ws,d));list.forEach((s,j)=>{
      let ss=null;
      if(TPL_KM[s.t]!=null){const k=runDefs.findIndex(r=>r.d===d&&r.t===s.t&&!r.used);runDefs[k].used=true;ss=runMade[k];}
      else if(s.t==='push'||s.t==='pull')ss=tplMuscu(s.t,date,p,logs,deload);
      else if(s.t==='pdc')ss=tplPdc(date,p,logs,deload);
      else if(s.t==='volley')ss=tplVolley(p);
      if(!ss)return;
      if(race&&toStr(race.dateObj)===date&&ss.sport==='course')return;
      ss.day=d;ss.date=date;ss.id=date+'_'+ss.kind+(j?'-'+j:'');sessions.push(ss);
    });});
    runDefs.forEach(r=>delete r.used);
    if(race){const di=daysBetween(ws,race.dateObj);sessions.push(Object.assign(mkSession({sport:'course',kind:'race-'+race.type,title:'Jour J : '+(race.def.kind==='time'?race.def.label.replace('…',' '+goalTargetLabel(race)):'course de '+fr(race.def.dist)+' km'),dureeMin:Math.round(race.def.dist*fit.p5/60)+30,intensite:'Compétition',hard:'legs',log:'run',testDist:race.def.dist,plannedKm:race.def.dist,goal:true,
      blocks:[txt('Stratégie','Pars à ton allure cible, pas plus vite, et accélère dans le dernier quart.')]}),{day:di,date:toStr(race.dateObj),id:toStr(race.dateObj)+'_race'}));}
    sessions.sort((a,b)=>a.day-b.day);
    const plannedKm=sessions.reduce((a,s)=>a+(s.sport==='course'?(s.plannedKm||0):0),0);
    const w={index:i,start:ws,deload,anyTaper:!!race,vol:Math.round(plannedKm),sessions,unplaced:[],pr:{phase:'Semaine type',k:0},ps:{phase:'Semaine type',k:0},pv:{phase:'Semaine type',k:0},
      label:deload?'Semaine allégée + tests':race?'Semaine de course':past?'Semaine passée':wsS<=ts?'Semaine en cours':'Prévision',
      note:deload?`Semaine allégée : ${Vi} km, soit 80 % de ton volume de base (${V} km). Le volume de base ne bouge pas cette semaine.`:race?`Semaine de course : ${Vi} km, volume réduit de 30 % pour arriver frais.`:reason,paceNote:`5 km à ${fmtPace(fit.p5)}, footing facile ${easyRange(fit.p5)}. ${fit.why}`};
    weeks.push(w);
    // Décision pour la semaine suivante
    if(past){
      const wl=logs.filter(l=>l.date>=wsS&&l.date<=weS&&l.statut!=='annulee');
      const done=Math.round(wl.reduce((a,l)=>a+(l.sport==='course'&&l.run?(num(l.run.distance)||0):0),0)*10)/10;
      const fs=sessions.find(s=>s.kind==='run-frac'),fl=fs&&logs.find(l=>l.plannedId===fs.id);
      const fracOk=!fs||(fl&&fl.statut==='realisee'&&((fl.run&&fl.run.fractions==='complet')||(((fl.run&&fl.run.reps)||[]).filter(x=>x>0).length>=fs.repsN)));
      const plannedRun=sessions.reduce((a,s)=>a+(s.sport==='course'?(s.plannedKm||0):0),0);
      const pain=wl.some(l=>num(l.douleur)>=4),ratio=plannedRun?done/plannedRun:1;
      if(deload||race)reason=`Semaine ${i+1} : retour à ${V} km après la semaine allégée.`;
      else if(pain||ratio<0.6){const nv=Math.max(Vmin,Math.round(V*0.9));reason=`Semaine ${i+1} : ${nv} km (−10 %). Semaine ${i} : ${pain?'douleur signalée':fr(done)+' km courus sur '+fr(plannedRun)+' prévus'}. On allège pour repartir sur de bonnes bases.`;V=nv;}
      else if(ratio>=0.9&&fracOk){const nv=Math.min(Vmax,Math.round(V*1.1));reason=nv>V?`Semaine ${i+1} : ${nv} km (+10 %). Semaine ${i} réussie : ${fr(done)} km sur ${fr(plannedRun)} prévus, fractionné complet.`:`Semaine ${i+1} : ${nv} km. Tu as atteint ton volume visé (${Vmax} km) : on le stabilise.`;V=nv;}
      else reason=`Semaine ${i+1} : ${V} km, comme la semaine ${i}. ${fr(done)} km courus sur ${fr(plannedRun)} prévus${fracOk?'':', fractionné incomplet'} : on ne monte pas tant que ce n’est pas réussi.`;
    }else if(!deload&&!race){const nv=Math.min(Vmax,Math.round(V*1.1));reason=`Semaine ${i+1} : prévision à ${nv} km si la semaine ${i} est réussie (au moins 90 % des kilomètres et le fractionné complet). Sinon, le volume reste identique.`;V=nv;}
    else reason=`Semaine ${i+1} : prévision à ${V} km après la semaine allégée.`;
  }
  return weeks;
}

function buildProgram(p,logs){
  const cur=currentMetrics(p,logs);
  const A=analyze(p,cur,logs);
  const start=mondayOf(A.start);
  const goals=A.goals.filter(g=>g.dateObj&&g.feas.verdict!=='past');
  let end=goals.length?new Date(Math.max(...goals.map(g=>g.dateObj))):addDays(start,8*7-1);
  let nW=clamp(goalWeek(start,end),1,78);
  if(!goals.length)nW=8;
  const ctx={p,cur,A,start};
  const runAll=A.runGoals, swAll=A.swGoals, vAll=A.vGoals;
  if(templateMode(p)){const nT=goals.length?nW:12;const weeks=buildTemplateWeeks(p,logs||[],A,start,nT);applyAdaptations(weeks,logs||[]);return {weeks,A,cur,start,nW:nT,tpl:true};}

  // Volume de course semaine par semaine
  const race=A.raceGoal;
  const peak=race?Math.max(race.def.peak,num(p.kmSemaine)||0):(()=>{const v=runAll.find(g=>g.def.kind==='volume');return v?num(v.cible):Math.max(12,Math.min(num(p.kmSemaine)||12,25));})();
  let base=Math.max(num(p.kmSemaine)||0,race||runAll.length?8:6);
  if(!race&&!runAll.length)base=Math.min(base,25);
  const vols=[];
  const weeks=[];
  for(let i=1;i<=nW;i++){
    const pr=phaseFor(runAll,i,start), ps=phaseFor(swAll,i,start), pv=phaseFor(vAll,i,start);
    const anyTaper=[pr,ps,pv].some(x=>x.phase==='Affûtage');
    const recov=[pr,ps,pv].some(x=>x.phase==='Récupération');
    const deload=recov||(!anyTaper&&i%4===0&&i<nW);
    let v;
    if(pr.phase==='Affûtage'){v=base*(pr.toGoal===0?0.5:pr.toGoal===1?0.65:0.8);}
    else if(pr.phase==='Récupération'){v=base*0.6;}
    else if(pr.phase==='Entretien'&&race){v=Math.min(base,Math.max(num(p.kmSemaine)||0,20))*(deload?0.75:1);}
    else if(deload){v=base*0.75;}
    else{if(i>1)base=Math.min(peak,base*1.075);v=base;}
    vols.push(Math.round(v));
    weeks.push({index:i,start:addDays(start,(i-1)*7),pr,ps,pv,deload,anyTaper,vol:Math.round(v)});
  }
  ctx.weeks=weeks;
  for(const w of weeks){
    w.label=weekLabel(w,A);
    w.sessions=buildWeek(w,ctx);
  }
  applyAdaptations(weeks,logs||[]);
  return {weeks,A,cur,start,nW};
}
/* ---- Adaptations après génération ---- */
function applyAdaptations(weeks,logs){
  const X=getExtra(),ts=toStr(today());
  for(const w of weeks)for(const s of w.sessions){
    // 1) Séances déplacées
    const o=X.overrides[s.id];
    if(o&&o!==s.date){const d=parseDate(o);if(d&&daysBetween(w.start,d)>=0&&daysBetween(w.start,d)<=6){s.movedFrom=s.date;s.date=o;s.day=dayIdx(d);}}
    // 2) Cibles ajustées d'après la dernière exécution de chaque exercice
    if(s.date>=ts&&!w.deload&&!s.prog&&(s.log==='sw')&&!logs.some(l=>l.plannedId===s.id)){
      for(const b of s.blocks){
        if(b.t!=='ex'||typeof b.cible!=='number')continue;
        const prev=logs.filter(l=>l.statut!=='annulee'&&l.date<s.date&&daysBetween(parseDate(l.date),parseDate(s.date))<=28&&(l.sets||[]).some(x=>x.nom===b.nom&&x.cible!=null)).sort((a,c)=>a.date<c.date?1:-1)[0];
        if(!prev)continue;
        const st=prev.sets.find(x=>x.nom===b.nom);const done=st.vals.filter(v=>v!=null);if(!done.length)continue;
        const lastC=+st.cible,step=b.unite==='s'?2:1,mean=done.reduce((a,c)=>a+c,0)/done.length;
        if(b.res){
          if(st.res==null)continue;
          b.lastRes=st.res;
          const ok=done.length===st.vals.length&&done.every(v=>v>=lastC)&&(prev.rpe==null||prev.rpe<=7);
          const ko=mean<lastC*0.8;
          const target=ok?Math.min(120,st.res+5):ko?Math.max(5,st.res-5):st.res;
          b.lastRes=target;
          b.charge=`Élastiques : vise ${target} kg (${ok?'+5 kg, toutes les séries réussies':ko?'−5 kg, cibles manquées':'même résistance'} le ${fmtDate(parseDate(prev.date))})`;
          if(target!==st.res)b.adj=`${target>st.res?'Résistance augmentée':'Résistance réduite'} : ${st.res} → ${target} kg.`;
          continue;
        }
        const success=done.length===st.vals.length&&done.every(v=>v>=lastC)&&(prev.rpe==null||prev.rpe<=7);
        const fail=mean<lastC*0.8||done.length<st.vals.length*0.75;
        let nc=b.cible;
        if(success)nc=Math.max(b.cible,lastC+step);
        else if(fail)nc=Math.min(b.cible,Math.max(1,lastC-step));
        nc=clamp(nc,Math.max(1,b.cible-3*step),b.cible+5*step);
        if(nc!==b.cible){
          b.adj=`${nc>b.cible?'Augmenté':'Réduit'} de ${b.cible} à ${nc}${b.unite==='s'?' s':''} : ${success?'toutes les séries réussies avec de la marge':'cibles manquées'} (séance du ${fmtDate(parseDate(prev.date))})`;
          b.cible=nc;
        }
      }
    }
    // 3) Version allégée choisie
    if(X.light[s.id]&&!logs.some(l=>l.plannedId===s.id))makeLight(s);
  }
}
function canLighten(s){return !s.fixedSlot&&!s.goal&&s.intensite!=='Test'&&(s.hard==='legs'||s.hard==='upper')&&s.intensite!=='Facile';}
function makeLight(s){
  if(s.light||!canLighten(s))return s;
  s.light=true;s.origTitle=s.title;
  if(s.sport==='course'){
    const km=Math.max(3,Math.round((s.plannedKm||6)*0.6));const min=Math.round((s.dureeMin||40)*0.6);
    s.title='Version allégée : footing facile';s.plannedKm=km;s.dureeMin=min;s.intensite='Facile';s.hard='none';
    s.blocks=[txt('Corps de séance',`${km} km (≈ ${min} min) en endurance fondamentale, sans aucune intensité. Remplace « ${s.origTitle} ».`),txt('Pourquoi','Ta forme du jour est basse : on garde l’habitude de courir sans creuser la fatigue. La séance difficile n’est pas reportée, on repart sur le plan normal ensuite.')];
  }else{
    s.title='Version allégée : '+s.origTitle;s.intensite='Modérée';s.dureeMin=Math.round((s.dureeMin||50)*0.65);
    s.blocks=s.blocks.filter(b=>!(b.t==='ex'&&/Drop|Sauts sur box|Bonds|élan/i.test(b.nom))).map(b=>b.t==='ex'?Object.assign({},b,{series:Math.max(2,Math.round(b.series*0.6)),note:((b.note||'')+' Aucune série à l’échec.').trim()}):b);
    s.blocks.unshift(txt('Version allégée','Environ 40 % de volume en moins, aucun saut intensif, aucune série à l’échec.'));

function fatigueStatus(dateStr){
  const reasons=[];let level='ok';
  const rs=null;
  const lastTwo=S.logs.filter(l=>l.date<=dateStr&&daysBetween(parseDate(l.date),parseDate(dateStr))<=4&&num(l.forme)!=null).sort((a,b)=>a.date<b.date?1:-1).slice(0,2);
  if(lastTwo.length===2&&lastTwo.every(l=>num(l.forme)<=2)){level='light';reasons.push('forme notée 2/5 ou moins sur tes deux dernières séances');}
  else if(lastTwo.length&&num(lastTwo[0].forme)<=2){level='caution';reasons.push('forme basse à ta dernière séance');}
  const ac=acwr(S.logs,parseDate(dateStr));
  if(ac.ratio!=null&&ac.ratio>1.5){level='light';reasons.push(`charge de la semaine ${fr(ac.ratio,2)} fois ton habitude`);}
  else if(ac.ratio!=null&&ac.ratio>1.3&&level==='ok'){level='caution';reasons.push(`charge en hausse (${fr(ac.ratio,2)})`);}
  const recentPain=S.logs.filter(l=>{const k=daysBetween(parseDate(l.date),parseDate(dateStr));return k>=0&&k<=3&&num(l.douleur)>=4;});
  if(recentPain.length){level='light';reasons.push(`douleur de ${Math.max(...recentPain.map(l=>num(l.douleur)))}/10 ces 3 derniers jours`);}
  return {level,reasons,rs};
}
/* Meilleur jour pour déplacer une séance dans sa semaine */
function moveOptions(s){
  const P=S.program;const w=P.weeks.find(x=>x.sessions.includes(s));if(!w)return [];
  const p=S.profile||{};const allowed=new Set([...(p.jours||[]),...(p.vClubJours||[])].map(k=>DAY_KEYS.indexOf(k)));
  const others=w.sessions.filter(x=>x!==s);
  const on=d=>others.filter(x=>x.day===d);
  const isMatch=d=>on(d).some(x=>x.hard==='match'||(x.goal&&x.hard==='legs'));
  const isLegs=d=>on(d).some(x=>x.hard==='legs'||x.hard==='match');
  const t=today();const out=[];
  for(let d=0;d<7;d++){
    const date=addDays(w.start,d);if(date<t||d===s.day)continue;
    let sc=0;const why=[];
    if(!allowed.has(d)){sc+=8;why.push('jour non disponible dans ton questionnaire');}
    const n=on(d).length;if(n>=2){sc+=20;why.push('déjà 2 séances ce jour-là');}else if(n===1){sc+=p.doubles?5:12;why.push(p.doubles?'double séance':'double séance (tu ne l’as pas autorisée)');}
    if(on(d).some(x=>x.sport===s.sport)){sc+=10;why.push('même sport le même jour');}
    if(s.hard==='legs'){if(isMatch(d)){sc+=30;why.push('jour de match ou d’objectif');}if(isMatch(d+1)){sc+=15;why.push('veille de match ou d’objectif');}if(isLegs(d-1)||isLegs(d+1)){sc+=5;why.push('séance de jambes difficile la veille ou le lendemain');}}
    if(s.hard==='upper'&&(on(d-1).some(x=>x.hard==='upper')||on(d+1).some(x=>x.hard==='upper'))){sc+=4;why.push('haut du corps déjà sollicité la veille ou le lendemain');}
    out.push({d,date,sc,why});
  }
  out.sort((a,b)=>a.sc-b.sc||a.d-b.d);
  out.forEach((o,i)=>{o.rank=o.sc<6?'ok':o.sc<15?'warn':'bad';o.best=i===0&&o.sc<15;});
  return out;
}
function weekLabel(w,A){
  if(w.pr.phase==='Récupération'||w.ps.phase==='Récupération'||w.pv.phase==='Récupération')return 'Récupération';
  if(w.anyTaper)return 'Affûtage';
  if(w.deload)return 'Semaine allégée + tests';
  const main=A.goals.filter(g=>g.priorite==='principal'&&g.feas.verdict!=='past').sort((a,b)=>a.dateObj-b.dateObj)[0];
  const sp=main?main.def.sport:null;
  const ph=sp==='course'?w.pr:sp==='sw'?w.ps:sp==='volley'?w.pv:(w.pr.phase!=='Entretien'?w.pr:w.ps.phase!=='Entretien'?w.ps:w.pv);

function paceRange(A,lo,hi){if(!A.vma)return null;return fmtTime(3600/(A.vma*hi))+'–'+fmtTime(3600/(A.vma*lo))+' /km';}
function hrRange(p,lo,hi){const m=num(p.fcMax);if(!m)return '';return ` · FC ${Math.round(m*lo)}–${Math.round(m*hi)} bpm`;}
function efTxt(ctx){const A=ctx.A,p=ctx.p;const r=paceRange(A,0.64,0.72);return (r?'allure '+r:'allure très facile, tu peux parler en phrases complètes')+hrRange(p,0.65,0.77)+' (effort 3–4/10)';}
function seuilTxt(ctx){const A=ctx.A,p=ctx.p;const r=paceRange(A,0.85,0.88);return (r?'allure '+r:'allure « confortablement difficile », phrases courtes')+hrRange(p,0.86,0.91)+' (effort 7/10)';}
function vmaTxt(ctx,pct){const A=ctx.A,p=ctx.p;const r=A.vma?fmtTime(3600/(A.vma*pct))+' /km':null;return (r?'allure '+r:'allure très soutenue mais régulière')+hrRange(p,0.93,1)+' (effort 9/10)';}
function racePace(g){if(!g||g.def.kind!=='time')return null;const t=parseTime(g.cible);return t?t/g.def.dist:null;}

function mkSession(o){return Object.assign({blocks:[],hard:'none',sport:'general',intensite:'Modérée',log:'free'},o);}
function exo(nom,series,cible,unite,extra){return Object.assign({t:'ex',nom,series,cible,unite:unite||'reps'},extra||{});}

/* --- Course --- */
function runSessionsFor(w,ctx,raceThisWeek){
  const A=ctx.A,p=ctx.p,q=A.quota.R,out=[];
  if(!q)return out;
  const ph=w.pr.phase,k=w.pr.k,V=w.vol;
  const race=A.raceGoal;
  const efPace=A.efPace;
  const kmMin=km=>Math.round(km*efPace/60);
  if(raceThisWeek){
    const rd=dayIdx(raceThisWeek.dateObj);
    out.push(mkSession({sport:'course',kind:'run-act',title:'Footing d’activation',prefer:Math.max(0,rd-2),dureeMin:30,intensite:'Facile',hard:'none',log:'run',plannedKm:Math.round(30*60/efPace*10)/10,
      blocks:[txt('Corps de séance','25 min en endurance fondamentale, '+efTxt(ctx)+'.'),txt('Fin','4 lignes droites de 80 m en accélération progressive, retour en marchant. Pas de fatigue : on garde de la fraîcheur.')]}));
    if(q>=3&&rd>=4)out.push(mkSession({sport:'course',kind:'run-ef',title:'Footing court',prefer:0,dureeMin:35,intensite:'Facile',log:'run',plannedKm:Math.round(35*60/efPace*10)/10,blocks:[txt('Corps de séance','35 min en endurance fondamentale, '+efTxt(ctx)+'.')]}));
    return out;
  }
  // test chrono pendant les semaines allégées (si objectif de temps ou pas de référence)
  const beginner=A.runLevel===0&&(num(p.kmSemaine)||0)<10;
  const needTest=(w.deload&&ph!=='Récupération'&&(race&&race.def.kind==='time'||!A.vma))||(w.index===1&&!ctx.cur.runRef&&race&&!beginner);
  const testDist=race&&race.def.dist>=20?10:5;
  let longKm,qualities=[];
  const longCap=race?race.def.long:(ph==='Entretien'?12:14);
  if(q>=3)longKm=Math.min(longCap,Math.max(5,V*0.33));else longKm=Math.min(longCap,Math.max(4,V*0.45));
  if(ph==='Récupération'){
    for(let j=0;j<Math.min(q,2);j++){const km=Math.max(4,Math.round(V/Math.min(q,2)));out.push(mkSession({sport:'course',kind:'run-ef',title:'Footing de récupération',dureeMin:kmMin(km),intensite:'Facile',log:'run',plannedKm:km,blocks:[txt('Corps de séance',`${km} km (≈ ${kmMin(km)} min) très facile, ${efTxt(ctx)}. Aucune intensité cette semaine.`)]}));}
    return out;
  }
  const nQual=ph==='Entretien'?1:(q>=4&&ph!=='Fondation'?2:(q>=2?1:0));
  const rp=racePace(race);
  const raceDist=race?race.def.dist:0;
  const qual=(n)=>{
    const W=(arr)=>arr[Math.min(k,arr.length-1)];
    if(beginner&&ph==='Fondation')return {title:'Course-marche progressive',hard:'legs',intensite:'Modérée',body:W(['6 × (4 min course facile / 1 min marche)','5 × (6 min course / 1 min marche)','4 × (8 min course / 1 min marche)']),allure:efTxt(ctx),warm:'5 min de marche rapide + mobilité chevilles et hanches.'};
    if(ph==='Entretien')return {title:'Fartlek',hard:'legs',intensite:'Modérée',body:W(['8 × (1 min vite / 1 min lent)','10 × (1 min vite / 1 min lent)','6 × (2 min vite / 1 min lent)']),allure:'les portions « vite » à une intensité de 7 à 8/10',warm:'15 min en endurance fondamentale + 3 gammes (talons-fesses, montées de genoux, foulées bondissantes).'};
    if(ph==='Fondation')return n===0?{title:'Seuil',hard:'legs',intensite:'Difficile',body:W(['3 × 8 min, récupération 2 min trottinée','3 × 10 min, récupération 2 min','2 × 15 min, récupération 3 min']),allure:seuilTxt(ctx),warm:'20 min en endurance fondamentale + gammes + 3 accélérations.'}
      :{title:'VMA courte',hard:'legs',intensite:'Difficile',body:W(['2 × (8 × 30 s / 30 s), 3 min entre les séries','2 × (10 × 30 s / 30 s)','3 × (8 × 30 s / 30 s)']),allure:vmaTxt(ctx,1.0),warm:'20 min en endurance fondamentale + gammes + 3 accélérations.'};
    if(ph==='Développement')return n===0?{title:'VMA',hard:'legs',intensite:'Difficile',body:W(['8 × 400 m, récupération 1 min 15 trottinée','10 × 400 m, récupération 1 min 15','6 × 800 m, récupération 2 min']),allure:vmaTxt(ctx,k===2?0.95:1.0),warm:'20 min en endurance fondamentale + gammes + 3 accélérations.'}
      :{title:'Seuil long',hard:'legs',intensite:'Difficile',body:W(['3 × 12 min, récupération 2 min','2 × 20 min, récupération 3 min','4 × 10 min, récupération 2 min']),allure:seuilTxt(ctx),warm:'20 min en endurance fondamentale + gammes.'};
    // Spécifique
    if(n===0){
      const sp=rp?`allure objectif ${fmtPace(rp)}`:seuilTxt(ctx);
      if(raceDist<=5)return {title:'Allure spécifique 5 km',hard:'legs',intensite:'Difficile',body:W(['5 × 1000 m, récupération 2 min','4 × 1200 m, récupération 2 min 30','3 × 1600 m, récupération 3 min']),allure:sp,warm:'20 min en endurance fondamentale + gammes + 3 accélérations.'};
      if(raceDist<=10)return {title:'Allure spécifique 10 km',hard:'legs',intensite:'Difficile',body:W(['4 × 2000 m, récupération 2 min','3 × 3000 m, récupération 2 min 30','2 × 4000 m, récupération 3 min']),allure:sp,warm:'20 min en endurance fondamentale + gammes.'};
      if(raceDist<=22)return {title:'Allure spécifique semi',hard:'legs',intensite:'Difficile',body:W(['3 × 4 km, récupération 3 min','3 × 5 km, récupération 3 min','2 × 7 km, récupération 3 min']),allure:sp,warm:'20 min en endurance fondamentale.'};
      return {title:'Seuil',hard:'legs',intensite:'Difficile',body:W(['2 × 20 min, récupération 3 min','3 × 15 min, récupération 3 min','2 × 25 min, récupération 4 min']),allure:seuilTxt(ctx),warm:'20 min en endurance fondamentale.'};
    }
    return {title:'Rappel de VMA',hard:'legs',intensite:'Difficile',body:W(['6 × 400 m, récupération 1 min 15','8 × 400 m, récupération 1 min 15','5 × 600 m, récupération 1 min 45']),allure:vmaTxt(ctx,1.0),warm:'20 min en endurance fondamentale + gammes.'};
  };
  if(needTest){
    out.push(mkSession({sport:'course',kind:'run-test',title:`Test chrono ${testDist} km`,dureeMin:Math.round(testDist*efPace/60*0.85)+30,intensite:'Test',hard:'legs',log:'run',testDist,plannedKm:testDist+4,
      blocks:[txt('Échauffement','20 min en endurance fondamentale + gammes + 3 accélérations de 100 m.'),txt('Test',`${testDist} km à fond, sur terrain plat et mesuré (piste ou parcours GPS fiable). Pars légèrement en dessous de ton allure maximale le premier kilomètre, accélère sur le dernier.`),txt('Retour au calme','10 min très facile. Saisis ton chrono exact : il recalcule tes allures et ton analyse.')]}));
  }
  for(let n=0;n<nQual-(needTest?1:0);n++){
    const Q=qual(n);
    const km=Math.max(5,Math.round(V*0.22));
    const dur=Math.round(km*efPace/60*0.9)+10;
    out.push(mkSession({sport:'course',kind:'run-q'+n,title:Q.title+(w.deload?' (volume réduit)':''),dureeMin:dur,intensite:w.deload?'Modérée':Q.intensite,hard:Q.hard,log:'run',plannedKm:km,
      blocks:[txt('Échauffement',Q.warm),txt('Corps de séance',(w.deload?'Fais seulement les deux tiers des répétitions. ':'')+Q.body+', '+Q.allure+'.'),txt('Retour au calme','10 min très facile + étirements doux des mollets et des fléchisseurs de hanche.')]}));
  }
  // sortie longue
  let usedKm=out.reduce((s,x)=>s+(x.plannedKm||0),0);
  const remaining=q-out.length;
  if(remaining>0){
    const nEf=remaining-1,rest=Math.max(0,V-usedKm);
    let lk=Math.round(Math.min(longCap,Math.max(longKm,nEf>0?rest/(nEf+1)*1.3:rest)));
    let body=`${lk} km (≈ ${kmMin(lk)} min) en endurance fondamentale, ${efTxt(ctx)}.`;
    if(ph==='Spécifique'&&rp&&raceDist>=20){const blocK=[6,10,12][Math.min(k,2)]*(raceDist>=40?1:0.6);body=`${lk} km dont les ${Math.round(blocK)} derniers à allure objectif (${fmtPace(rp)}). Teste ta nutrition de course (gel ou boisson toutes les 30–40 min).`;}
    else if(ph==='Développement'&&raceDist>=10)body+=' Termine par 10 min un peu plus soutenues (effort 6/10).';
    out.push(mkSession({sport:'course',kind:'run-long',title:'Sortie longue',prefer:5,dureeMin:kmMin(lk),intensite:'Modérée',hard:'legs',log:'run',plannedKm:lk,long:true,
      blocks:[txt('Corps de séance',body),txt('Conseil','Hydrate-toi, pars très lentement les 15 premières minutes. Si tu dois t’arrêter pour une douleur, coupe la séance.')]}));
    usedKm+=lk;
  }
  const left=q-out.length;
  for(let j=0;j<left;j++){
    const km=Math.max(4,Math.round((V-usedKm)/left));
    out.push(mkSession({sport:'course',kind:'run-ef'+j,title:'Endurance fondamentale',dureeMin:kmMin(km),intensite:'Facile',hard:'none',log:'run',plannedKm:km,
      blocks:[txt('Corps de séance',`${km} km (≈ ${kmMin(km)} min), ${efTxt(ctx)}.`+(j===0?' Ajoute 4 lignes droites de 80 m à la fin.':''))]}));
  }
  return out;
}

function has(p,m){return (p.materiel||[]).includes(m);}
function setsReps(max,pct,deload,minSeries,maxSeries){
  const reps=Math.max(1,Math.round(max*(deload?0.5:pct)));
  let series=reps<=3?maxSeries:reps<=8?Math.max(minSeries,maxSeries-1):minSeries;
  if(deload)series=Math.max(2,series-2);
  return {series,reps};
}

/* Exercice de l'app : nom exact + rubrique où trouver la vidéo + variantes de la même famille dans l'app */
function appx(nom,cat,series,cible,start,extra){return swx(nom,series,cible,start,Object.assign({app:cat},extra||{}));}
function hasSW(p){return (p.materiel||[]).includes('smartworkout');}
function swx(nom,series,cible,start,extra){return exo(nom,series,cible,'reps',Object.assign({res:true,charge:`Élastiques combinés : point de départ ≈ ${start} kg, ajuste pour garder 2 répétitions en réserve`},extra||{}));}
function bands(p){return (p.elastiques||[]).filter(b=>num(b.max)>0).slice().sort((a,b)=>num(a.max)-num(b.max)||(num(a.min)||0)-(num(b.min)||0));}
function bandName(b){if(!b)return '';const mn=num(b.min);return `${b.nom||'Élastique'} (${mn!=null?fr(mn)+'–':''}${fr(num(b.max))} kg)`;}
function useBand(p,u){if(!bands(p).length)return false;const us=p.elasUsage;return !us||!us.length||us.includes(u);}
/* Choix de l'élastique : on part de celui avec lequel tu fais refReps, et on vise targetReps.
   Trop facile (3 reps de marge) : élastique plus léger. Trop dur : élastique plus fort. */
function pickBand(p,refId,refReps,targetReps,dflt){
  const bs=bands(p);if(!bs.length)return null;
  let i=bs.findIndex(b=>b.id===refId);
  if(i<0)return dflt==='light'?bs[0]:dflt==='mid'?bs[Math.floor((bs.length-1)/2)]:bs[bs.length-1];
  if(refReps!=null){if(refReps>=targetReps+3&&i>0)i--;else if(refReps<Math.max(2,targetReps-3)&&i<bs.length-1)i++;}
  return bs[i];
}
function pullBlock(ctx,w,ph){

  const assisted=b=>exo('Tractions assistées à l’élastique',dl?3:4,dl?5:[6,7,8][kk],'reps',{repos:'2 min',band:bandName(b),note:'Amplitude complète. Quand tu réussis 4 × 8 propres, passe à l’élastique plus léger.'});
  if(c.pullups<1){
    if(bPull)ex.push(assisted(bPull));

    if(!bPull)ex.push(hasSW(p)?appx('Rowing Buste Penché (Prise Large)','Dos',3,dl?8:[10,12,12][kk],30,{repos:'90 s',alt:['Rowing Buste Penché (Prise Supination)','Tirage Buste Penché','Tirage Horizontal (Bandes de Résistance)'],note:'Coudes près du corps, omoplates serrées en fin de mouvement.'}):exo('Tractions australiennes (rangées sous barre basse)',3,dl?6:[8,10,12][kk],'reps',{repos:'90 s'}));
    ex.push(exo('Suspension active (dead hang, omoplates engagées)',3,dl?20:[20,30,40][Math.min(w.ps.k,2)],'s',{repos:'60 s'}));
  }else if(c.pullups<5){
    ex.push(exo('Tractions strictes',dl?3:5,Math.max(1,c.pullups-1),'reps',{repos:'2 min 30',note:'Bras tendus en bas, menton au-dessus de la barre en haut.'}));
    ex.push(exo('Tractions négatives (descente en 5 s)',dl?2:3,3,'reps',{repos:'2 min'}));
    if(bPull){const lb=pickBand(p,p.trAssBand,num(p.trAssReps),10,'heavy');ex.push(Object.assign(assisted(lb),{series:3,cible:dl?6:[8,9,10][kk],note:'Séries de volume après les tractions strictes.'}));}
    else ex.push(hasSW(p)?appx('Rowing Buste Penché (Prise Large)','Dos',3,dl?8:10,35,{repos:'90 s',alt:['Rowing Buste Penché (Prise Supination)','Tirage Buste Penché']}):exo('Tractions australiennes',3,dl?6:10,'reps',{repos:'90 s'}));
  }else{
    const weighted=ph==='Développement'&&!dl&&c.pullups>=10&&has(p,'lest');
    if(weighted){
      ex.push(exo('Tractions lestées',5,5,'reps',{repos:'3 min',lest:true,charge:'+5 à +10 kg (2 répétitions en réserve)'}));
      const sr=setsReps(c.pullups,0.55,false,3,4);ex.push(exo('Tractions strictes',sr.series,sr.reps,'reps',{repos:'2 min'}));
    }else{const sr=setsReps(c.pullups,pct,dl,4,6);ex.push(exo('Tractions strictes',sr.series,sr.reps,'reps',{repos:'2 min 30',note:ph==='Spécifique'&&goals.has('pullups')?'Dernière série : maximum moins 2.':'Garde 2 répétitions en réserve.'}));}
  }

    if(useBand(p,'muscleup')&&c.muscleup<1){const b=pickBand(p,null,null,0,'heavy');ex.push(exo('Muscle-ups assistés à l’élastique',dl?2:4,3,'reps',{repos:'2 min 30',band:bandName(b),note:'L’élastique doit t’aider surtout au passage au-dessus de la barre. Change pour un plus léger dès que 4 × 3 sont propres.'}));}
    else ex.push(exo('Transitions muscle-up (barre basse)',dl?2:4,3,'reps',{repos:'2 min'}));
  }
  if(goals.has('frontlever')||ph==='Entretien'||true){
    const s=c.frontlever;
    if(goals.has('frontlever')){
      const hold=s>=1?FL_STAGES[s]:'Tuck';
      ex.push(exo(`Front lever ${hold.toLowerCase()} (tenue)`,dl?4:6,dl?6:[8,10,12][Math.min(w.ps.k,2)],'s',{repos:'2 min'}));
      if(s<5&&useBand(p,'frontlever'))ex.push(exo(`Front lever ${FL_STAGES[Math.min(5,Math.max(s,1)+1)].toLowerCase()} assisté à l’élastique`,dl?3:4,dl?6:[8,10,12][kk],'s',{repos:'2 min',band:bandName(pickBand(p,null,null,0,'mid')),note:'Élastique passé sous les hanches. Corps gainé, bras tendus.'}));
      if(s<5)ex.push(exo(`Négatifs de front lever ${FL_STAGES[Math.min(5,s+1)].toLowerCase()}`,dl?2:3,3,'reps',{repos:'2 min',note:'Descente contrôlée de 3 à 5 s.'}));
    }
  }
  if(hasSW(p))ex.push(exo('Face Pull (Poulie Haute)',3,15,'reps',{res:true,app:'Épaules',alt:['Reverse Fly (Poulie Moyenne)','Oiseau Debout Face','Cuban Press'],charge:'Élastiques légers : 5 à 15 kg',repos:'60 s',note:'Tire vers le front en écartant les mains. Prévention de l’épaule pour l’attaque au volley.'}));
  ex.push(exo('Relevés de jambes suspendu',3,dl?6:[8,10,12][Math.min(w.ps.k,2)],'reps',{repos:'90 s'}));
  return ex;
}
function pushBlock(ctx,w,ph){
  const c=ctx.cur,p=ctx.p,pct=PCT[ph][Math.min(w.ps.k,2)],dl=w.deload,ex=[];
  const goals=new Set(ctx.A.swGoals.map(g=>g.type));
